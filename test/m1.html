<!doctype html><html><head><meta charset="utf-8"></head><body>
<div id="a"></div><div id="b"></div>
<script type="module">
import mermaid from '/mermaid-dist/mermaid.esm.min.mjs';
import { createWermaid, parseSource, withTheme, defineTheme, listThemes, getTheme } from '/src/wermaid.js';
mermaid.initialize({ startOnLoad: false });
const wermaid = createWermaid(mermaid);
const R = []; const ok = (name, cond, extra) => R.push({ name, pass: !!cond, extra });

const BASE = `flowchart LR
  A[Start] --> B{Check}
  B -->|yes| C(Do it)
  B e9@-->|no| D[(DB)]
  subgraph G1 [Group one]
    C --> E[End]
  end
  subgraph G2 [Isolated]
    X --> Y
  end
  D --> E`;

const snap = (svg) => ({
  nodes: Object.fromEntries([...svg.querySelectorAll('g.node')].map((g) => [g.id, g.getAttribute('transform')])),
  paths: Object.fromEntries([...svg.querySelectorAll('path[data-edge]')].map((p) => [p.dataset.id, (p.getAttribute('d') || '') + '|' + (p.getAttribute('transform') || '')])),
  clusters: Object.fromEntries([...svg.querySelectorAll('g.cluster > rect')].map((r) => [r.parentNode.id, ['x','y','width','height'].map((k) => r.getAttribute(k)).join(',')])),
});

// 1. No block → identical to stock Mermaid.
{
  const { svg } = await mermaid.render('same', BASE);
  document.getElementById('a').innerHTML = svg;
  const stock = document.getElementById('a').innerHTML;
  const d = await wermaid.render(document.getElementById('b'), BASE, { id: 'same' });
  ok('no block: SVG identical to stock', document.getElementById('b').innerHTML === stock);
  ok('no block: supported + scene read', d.supported && d.scene.nodes.size === 7 && d.scene.clusters.size === 2 && d.scene.edges.size === 6,
     { nodes: d.scene?.nodes.size, clusters: d.scene?.clusters.size, edges: d.scene?.edges.size });
}

// 2. Pin one node → only it and its edges change.
{
  const base = await wermaid.render(document.getElementById('a'), BASE, { id: 'p' });
  const s0 = snap(base.svg);
  const bBox = base.scene.nodes.get('B').box;
  const d = await wermaid.render(document.getElementById('b'), BASE + `\n%% @layout\n%% B at ${bBox.cx},${bBox.cy + 140}\n%% @end`, { id: 'p' });
  const s1 = snap(d.svg);
  const changedNodes = Object.keys(s1.nodes).filter((k) => s1.nodes[k] !== s0.nodes[k]);
  const changedPaths = Object.keys(s1.paths).filter((k) => s1.paths[k] !== s0.paths[k]).sort();
  ok('pin: only B moved', changedNodes.length === 1 && changedNodes[0].includes('-B-'), changedNodes);
  ok('pin: only B\'s edges re-routed', JSON.stringify(changedPaths) === JSON.stringify(['L_A_B_0', 'L_B_C_0', 'e9']), changedPaths);
  const g = d.geometry.nodes.get('B');
  ok('pin: B center at requested point', Math.abs(g.box.cy - (bBox.cy + 140)) < 0.01);
  // Edge end should sit on B's boundary (minus arrow pullback)
  const e = d.geometry.edges.get('L_A_B_0');
  const last = e.points.at(-1);
  // B is a diamond: boundary points satisfy |dx|/hw + |dy|/hh = 1
  const onDiamond = Math.abs(Math.abs(last.x - g.box.cx) / (g.box.w / 2) + Math.abs(last.y - g.box.cy) / (g.box.h / 2) - 1) < 0.01;
  ok('pin: A→B ends on B boundary', onDiamond, { last, box: g.box });
  ok('pin: viewBox grew to fit', d.svg.getAttribute('viewBox') !== base.svg.getAttribute('viewBox'), [base.svg.getAttribute('viewBox'), d.svg.getAttribute('viewBox')]);
}

// 3. Move a node inside a subgraph → subgraph refits.
{
  const d0 = await wermaid.render(document.getElementById('a'), BASE, { id: 'g' });
  const c = d0.scene.nodes.get('C').box;
  const d = await wermaid.render(document.getElementById('b'), BASE + `\n%% @layout\n%% C nudge 0,-160\n%% @end`, { id: 'g' });
  const G1 = d.geometry.clusters.get('G1').box;
  const C = d.geometry.nodes.get('C').box;
  ok('group: G1 contains moved C', G1.y <= C.y && G1.y + G1.h >= C.y + C.h, { G1, C });
  ok('group: G2 untouched', !d.geometry.clusters.get('G2').changed);
  const r = d.svg.querySelector(`#g-G1 > rect`);
  const rb = r.getBBox();
  ok('group: rect drawn at new size', Math.abs(rb.height - G1.h) < 0.5, { rb: rb.height, G1: G1.h });
}

// 4. Stale ids → warnings, not crashes.
{
  const d = await wermaid.render(document.getElementById('b'), BASE + `\n%% @layout\n%% Nope at 1,2\n%% Q->R via 3,4\n%% A frob 2\n%% @end`, { id: 's' });
  ok('stale: two warnings', d.warnings.length === 2, d.warnings);
  ok('stale: parse error reported with line', d.parseErrors.length === 1 && d.parseErrors[0].line > 0, d.parseErrors);
}

// 5. Source edits keep unrelated overrides.
{
  const src = BASE + `\n%% @layout\n%% D nudge 0,60\n%% @end`;
  const edited = src.replace('D --> E', 'D --> E\n  E --> F[New node]');
  const d = await wermaid.render(document.getElementById('b'), edited, { id: 'e' });
  const d0 = await wermaid.render(document.getElementById('a'), edited.replace(/%% @layout[\s\S]*/, ''), { id: 'e' });
  ok('edit: override survives a new node', Math.abs(d.geometry.nodes.get('D').box.cy - d0.scene.nodes.get('D').box.cy - 60) < 0.01 && d.warnings.length === 0, d.warnings);
}

// 6. Subgraph nudge carries children; 7. resize; 8. via + label
{
  const d0 = await wermaid.render(document.getElementById('a'), BASE, { id: 'c' });
  const d = await wermaid.render(document.getElementById('b'), BASE + `\n%% @layout\n%% G2 nudge 400,0\n%% A size 160x80\n%% edge e9 via 300,500 ; label 0,20\n%% @end`, { id: 'c' });
  const X0 = d0.scene.nodes.get('X').box, X1 = d.geometry.nodes.get('X').box;
  ok('group nudge: X moved with G2', Math.abs(X1.cx - X0.cx - 400) < 0.01);
  ok('group nudge: X→Y path shifted, not re-routed', d.geometry.edges.get('L_X_Y_0').mode === 'shift');
  const A = d.geometry.nodes.get('A').box;
  const ab = d.svg.querySelector('[id$="-flowchart-A-0"]');
  const rb = ab.querySelector('.label-container').getBoundingClientRect();
  ok('resize: A drawn 160x80', A.w === 160 && A.h === 80 && Math.abs(rb.width / rb.height - 2) < 0.05, { w: rb.width, h: rb.height });
  const e9 = d.geometry.edges.get('e9');
  ok('via: route passes through waypoint', e9.points.some((p) => p.x === 300 && p.y === 500));
  ok('label: offset applied', e9.labelBox && Math.abs(e9.labelBox.cy - e9.labelAuto.y - 20) < 0.01);
}

// 8b. Subgraph size: a frame of exactly that size, centred on its contents; never smaller than them.
{
  const d = await wermaid.render(document.getElementById('b'), BASE + `\n%% @layout\n%% G1 size 420x260\n%% G2 size 10x10\n%% @end`, { id: 'z' });
  const G1 = d.geometry.clusters.get('G1').box, G2 = d.geometry.clusters.get('G2').box;
  const inner = (ids) => {
    const bs = ids.map((id) => d.geometry.nodes.get(id).box);
    const x0 = Math.min(...bs.map((b) => b.x)), x1 = Math.max(...bs.map((b) => b.x + b.w));
    const y0 = Math.min(...bs.map((b) => b.y)), y1 = Math.max(...bs.map((b) => b.y + b.h));
    return { cx: (x0 + x1) / 2, cy: (y0 + y1) / 2, w: x1 - x0, h: y1 - y0 };
  };
  const i1 = inner(['C', 'E']), i2 = inner(['X', 'Y']);
  ok('subgraph size: frame drawn at that size', G1.w === 420 && G1.h === 260, G1);
  ok('subgraph size: centred on its contents', Math.abs(G1.cx - i1.cx) < 0.01 && Math.abs(G1.cy - i1.cy) < 0.01, { G1, i1 });
  ok('subgraph size: too small grows to fit', G2.w >= i2.w && G2.h >= i2.h && Math.abs(G2.cx - i2.cx) < 0.01, { G2, i2 });
  const rb = d.svg.querySelector('#z-G1 > rect').getBBox();
  ok('subgraph size: rect drawn at new size', Math.abs(rb.width - 420) < 0.5 && Math.abs(rb.height - 260) < 0.5, { w: rb.width, h: rb.height });
  ok('subgraph size: round-trips', /%% G1\s+size 420x260/.test(d.writeSource(BASE)), d.writeSource(BASE));
}

// 9. Other diagram types
{
  const st = await wermaid.render(document.getElementById('b'), `stateDiagram-v2
  [*] --> Idle
  Idle --> Running : start
  Running --> Idle : stop
  state Running {
    [*] --> Warm
    Warm --> Hot
  }
  Running --> [*]`, { id: 'st' });
  ok('state: supported', st.supported && st.scene.nodes.size >= 4, { nodes: st.scene && [...st.scene.nodes.keys()], clusters: st.scene && [...st.scene.clusters.keys()], edges: st.scene && [...st.scene.edges.keys()] });
  const cl = await wermaid.render(document.getElementById('b'), `classDiagram
  class Order { +id: UUID\n +total() Money }
  class Customer
  Customer "1" --> "*" Order : places
  Order *-- LineItem`, { id: 'cl' });
  ok('class: supported', cl.supported && cl.scene.nodes.size === 3, { nodes: cl.scene && [...cl.scene.nodes.keys()], edges: cl.scene && [...cl.scene.edges.values()].map(e=>[e.id,e.pull]) });
  const sq = await wermaid.render(document.getElementById('b'), `sequenceDiagram\n  A->>B: hi`, { id: 'sq' });
  ok('sequence: renders stock, marked unsupported', !sq.supported && sq.svg);
}

// 10. Round trip: write block back
{
  const d = await wermaid.render(document.getElementById('b'), BASE, { id: 'w' });
  const ov = d.overrides;
  ov.targets.set('B', { kind: 'node', selector: 'B', at: { x: 250.123, y: 400 } });
  ov.targets.set('edge:e9', { kind: 'edge', selector: 'e9', via: [{ x: 1, y: 2 }] });
  ov.targets.set('edge:L_A_B_0', { kind: 'edge', selector: 'L_A_B_0', label: { x: 0, y: -10 } });
  d.setOverrides(ov);
  const out = d.writeSource(BASE);
  const back = parseSource(out);
  ok('roundtrip: block written', /%% @layout v1[\s\S]*%% B\s+at 250.1,400[\s\S]*%% A->B\s+label 0,-10[\s\S]*%% edge e9\s+via 1,2[\s\S]*%% @end/.test(out), out);
  ok('roundtrip: parses back', back.overrides.targets.size === 3 && back.body === BASE);
}
// 11. Obstacle avoidance: a node dropped onto an edge pushes that edge around it,
//     and no re-routed edge passes through any shape.
{
  const d0 = await wermaid.render(document.getElementById('a'), BASE, { id: 'o' });
  const A = d0.scene.nodes.get('A').box, B = d0.scene.nodes.get('B').box;
  const mid = { x: (A.x + A.w + B.x) / 2, y: A.cy };
  const d = await wermaid.render(document.getElementById('b'), BASE + `\n%% @layout\n%% Y at ${mid.x},${mid.y}\n%% C nudge 0,200\n%% @end`, { id: 'o' });
  const ab = d.geometry.edges.get('L_A_B_0');
  ok('avoid: edge under a dropped node re-routes', ab.mode === 'route', ab.mode);
  const hits = [];
  for (const [id, ge] of d.geometry.edges) {
    if (ge.mode !== 'route' || ge.style !== 'orthogonal') continue;
    const e = d.scene.edges.get(id);
    const pts = ge.points;
    for (const [nid, n] of d.geometry.nodes) {
      if (nid === e.start || nid === e.end) continue;
      const b = n.box;
      for (let i = 0; i < pts.length - 1; i++) {
        const p = pts[i], q = pts[i + 1];
        const x0 = Math.min(p.x, q.x), x1 = Math.max(p.x, q.x), y0 = Math.min(p.y, q.y), y1 = Math.max(p.y, q.y);
        if (x1 > b.x + 1 && x0 < b.x + b.w - 1 && y1 > b.y + 1 && y0 < b.y + b.h - 1) hits.push([id, nid]);
      }
    }
  }
  ok('avoid: no routed edge crosses a shape', hits.length === 0, hits);
  const orth = [...d.geometry.edges.values()].filter((g) => g.style === 'orthogonal');
  ok('avoid: routes are orthogonal', orth.length > 0 && orth.every((g) => g.points.every((p, i, a) => !i || Math.abs(p.x - a[i - 1].x) < 0.01 || Math.abs(p.y - a[i - 1].y) < 0.01)), orth.map((g) => g.points));
}
// 12. Edge looks
{
  const axis = (pts) => pts.every((p, i, a) => !i || Math.abs(p.x - a[i - 1].x) < 0.01 || Math.abs(p.y - a[i - 1].y) < 0.01);
  const dOf = (d, id) => d.scene.edges.get(id).pathEl.getAttribute('d');
  const st = await wermaid.render(document.getElementById('a'), BASE, { id: 'k' });
  const stock = document.getElementById('a').innerHTML;
  const o = await wermaid.render(document.getElementById('b'), BASE + `\n%% @layout\n%% @edges orthogonal\n%% @end`, { id: 'k' });
  const all = [...o.geometry.edges.values()];
  ok('@edges orthogonal: every edge routed square', all.every((g) => g.mode === 'route' && g.look === 'orthogonal' && axis(g.points)), all.map((g) => [g.mode, g.look]));
  ok('@edges orthogonal: no curves in paths', [...o.scene.edges.keys()].every((id) => !/[CQ]/.test(dOf(o, id))));
  ok('@edges orthogonal: shapes untouched', [...o.geometry.nodes.values()].every((g) => !g.changed));
  const r = await wermaid.render(document.getElementById('b'), BASE + `\n%% @layout\n%% @edges rounded 10\n%% @end`, { id: 'k' });
  ok('@edges rounded: corners are rounded', [...r.scene.edges.keys()].some((id) => /Q/.test(dOf(r, id))) && r.overrides.settings.edges.radius === 10);
  await wermaid.render(document.getElementById('b'), BASE + `\n%% @layout\n%% @edges curved\n%% @end`, { id: 'k' });
  ok('@edges curved: untouched diagram stays stock', document.getElementById('b').innerHTML === stock);
  const one = await wermaid.render(document.getElementById('b'), BASE + `\n%% @layout\n%% A->B style orthogonal\n%% @end`, { id: 'k' });
  const routedIds = [...one.geometry.edges].filter(([, g]) => g.mode === 'route').map(([id]) => id);
  ok('per-edge style routes only that edge', routedIds.length === 1 && routedIds[0] === 'L_A_B_0', routedIds);
  const v = await wermaid.render(document.getElementById('b'), BASE + `\n%% @layout\n%% @edges orthogonal\n%% edge e9 via 330,520 420,560\n%% @end`, { id: 'k' });
  const e9 = v.geometry.edges.get('e9');
  const onRoute = (pts, q) => pts.some((p, i) => i && Math.min(p.x, pts[i - 1].x) - 0.01 <= q.x && q.x <= Math.max(p.x, pts[i - 1].x) + 0.01 && Math.min(p.y, pts[i - 1].y) - 0.01 <= q.y && q.y <= Math.max(p.y, pts[i - 1].y) + 0.01);
  ok('orthogonal via route is square and passes through bends', axis(e9.points) && onRoute(e9.points, { x: 330, y: 520 }) && onRoute(e9.points, { x: 420, y: 560 }), e9.points);
  v.overrides.targets.get('edge:e9').style = 'curved';
  const out = v.writeSource(BASE);
  ok('edge looks round-trip', /%% @edges orthogonal/.test(out) && /edge e9\s+via [\d, ]+ ; style curved/.test(out) && parseSource(out).overrides.settings.edges.style === 'orthogonal', out);
  const bad = parseSource(BASE + `\n%% @layout\n%% @edges wavy\n%% A->B style zig\n%% @end`);
  ok('bad looks report errors', bad.errors.length === 2, bad.errors);
}
// 13. Palettes
{
  const fillOf = (d) => getComputedStyle(d.svg.querySelector('g.node .label-container')).fill;
  const pele = await wermaid.render(document.getElementById('b'), BASE + `\n%% @layout\n%% @theme pele\n%% B nudge 0,40\n%% @end`, { id: 't' });
  ok('@theme pele: nodes filled with Pele surface', fillOf(pele) === 'rgb(242, 240, 229)', fillOf(pele));
  ok('@theme pele: overrides still apply', Math.abs(pele.geometry.nodes.get('B').delta.y - 40) < 0.01 && pele.theme === 'pele' && pele.background === '#fffcf0');
  const dark = await wermaid.render(document.getElementById('b'), BASE + `\n%% @layout\n%% @theme pele\n%% @end`, { id: 't', dark: true });
  ok('@theme pele dark variant', fillOf(dark) === 'rgb(28, 27, 26)', fillOf(dark));
  document.getElementById('b').style.setProperty('--pele-surface', '#123456');
  const skin = await wermaid.render(document.getElementById('b'), BASE + `\n%% @layout\n%% @theme pele\n%% @end`, { id: 't' });
  document.getElementById('b').style.removeProperty('--pele-surface');
  ok('pele reads --pele-* variables from the page', fillOf(skin) === 'rgb(18, 52, 86)', fillOf(skin));
  const wm = await wermaid.render(document.getElementById('b'), BASE, { id: 't', theme: 'wermaid' });
  ok('theme option: wermaid has no fill', fillOf(wm) === 'rgb(249, 249, 247)', fillOf(wm));
  const mm = await wermaid.render(document.getElementById('b'), BASE, { id: 't', theme: 'mermaid' });
  ok('theme option: mermaid neutral', fillOf(mm) === 'rgb(238, 238, 238)', fillOf(mm));
  ok('front matter stays first', withTheme('---\ntitle: X\n---\nflowchart LR\n A-->B', 'pele').startsWith('---\ntitle: X\n---\n%%{init:'));
  // An unregistered name is a warning at render time (section 14); only a malformed name is an error.
  const bad = parseSource(BASE + `\n%% @layout\n%% @theme Neon!\n%% @end`);
  ok('malformed palette name reports an error', bad.errors.length === 1 && !bad.overrides.settings.theme, bad.errors);
  pele.overrides.settings.edges = { style: 'rounded' };
  const out = pele.writeSource(BASE);
  ok('palette round-trips', /%% @layout v1\n%% @theme pele\n%% @edges rounded/.test(out), out);
}
// 14. Custom themes
{
  const el = document.getElementById('b');
  const fillOf = (d) => getComputedStyle(d.svg.querySelector('g.node .label-container')).fill;
  const textOf = (d) => getComputedStyle(d.svg.querySelector('g.node .nodeLabel')).color;
  const rgb = (c) => {
    const s = String(c).trim();
    let m = s.match(/^#([0-9a-f]{3}|[0-9a-f]{6})$/i);
    if (m) { const h = m[1].length === 3 ? [...m[1]].map((x) => x + x).join('') : m[1]; return [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16)); }
    m = s.match(/^rgba?\(\s*([\d.]+)[,\s]+([\d.]+)[,\s]+([\d.]+)/i);
    return m ? m.slice(1, 4).map(Number) : [NaN, NaN, NaN];
  };
  const luminance = (c) => {
    const [r, g, b] = rgb(c).map((v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; });
    return 0.2126 * r + 0.7152 * g + 0.0722 * b;
  };
  const contrast = (a, b) => { const [x, y] = [luminance(a), luminance(b)].sort((p, q) => q - p); return (x + 0.05) / (y + 0.05); };
  const nodeGap = (d) => Math.abs(d.geometry.nodes.get('C').box.cy - d.geometry.nodes.get('D').box.cy);
  const throws = (fn) => { try { fn(); return false; } catch (e) { return e instanceof TypeError; } };

  defineTheme('acme', { label: 'Acme', colors: { nodeFill: '#ffeedd', background: '#ffffff', text: '#111111' },
    edges: { style: 'orthogonal' }, spacing: { node: 120 } });
  ok('theme: listed', listThemes().some((t) => t.name === 'acme' && t.label === 'Acme'), listThemes());
  ok('theme: built-ins listed first', listThemes().slice(0, 3).map((t) => t.name).join() === 'mermaid,wermaid,pele', listThemes());
  ok('theme: getTheme', getTheme('acme')?.label === 'Acme' && getTheme('nope') === null && getTheme('constructor') === null);
  const a = await wermaid.render(el, BASE + '\n%% @layout\n%% @theme acme\n%% @end', { id: 't1' });
  const acmeRender = a;
  ok('theme: block @theme uses the spec fill', fillOf(a) === 'rgb(255, 238, 221)', fillOf(a));
  ok('theme: theme edge style routes every edge', [...a.geometry.edges.values()].every((g) => g.mode === 'route' && g.look === 'orthogonal'), [...a.geometry.edges.values()].map((g) => [g.mode, g.look]));
  ok('theme: scene.edgeDefault from the theme', a.scene.edgeDefault?.style === 'orthogonal' && a.theme === 'acme' && a.background === '#ffffff', a.scene.edgeDefault);
  ok('theme: edge default is not written to the block', !/@edges/.test(a.writeSource(BASE + '\n%% @layout\n%% @theme acme\n%% @end')));
  const b = await wermaid.render(el, BASE + '\n%% @layout\n%% @theme acme\n%% @edges curved\n%% @end', { id: 't2' });
  ok('theme: @edges beats the theme', [...b.geometry.edges.values()].every((g) => g.look !== 'orthogonal'), [...b.geometry.edges.values()].map((g) => g.look));
  const ps = await wermaid.render(el, BASE + '\n%% @layout\n%% @theme acme\n%% @edges curved\n%% A->B style orthogonal\n%% @end', { id: 't2b' });
  const looks = Object.fromEntries([...ps.geometry.edges].map(([id, g]) => [id, g.look]));
  ok('theme: per-edge style beats both', looks.L_A_B_0 === 'orthogonal' && Object.entries(looks).every(([id, l]) => id === 'L_A_B_0' || l !== 'orthogonal'), looks);
  const d = await wermaid.render(el, BASE + '\n%% @layout\n%% @theme acme\n%% @end', { id: 't3', dark: true });
  const dFill = fillOf(d); // read now: the next render into `el` replaces this SVG
  ok('theme: dark derived', luminance(d.background) < 0.2 && contrast(textOf(d), d.background) >= 4.5, [d.background, textOf(d)]);
  defineTheme('acme-dark', { extends: 'acme', dark: { colors: { background: '#202020' } } });
  const dd = await wermaid.render(el, BASE, { id: 't3b', theme: 'acme-dark', dark: true });
  ok('theme: dark values win', dd.background === '#202020' && fillOf(dd) === dFill, [dd.background, fillOf(dd), dFill]);
  const u = await wermaid.render(el, BASE + '\n%% @layout\n%% @theme nope\n%% @end', { id: 't4' });
  ok('theme: unknown name warns and falls back', u.parseErrors.length === 0 && u.warnings.some((w) => w.includes('"nope"')) && u.theme === 'wermaid', [u.parseErrors, u.warnings, u.theme]);
  u.setOverrides(u.overrides);
  ok('theme: warning survives setOverrides', u.warnings.some((w) => w.includes('"nope"')), u.warnings);
  u.showStock();
  ok('theme: warning survives showStock', u.warnings.some((w) => w.includes('"nope"')), u.warnings);
  ok('theme: unknown name round-trips', /%% @theme nope/.test(u.writeSource(BASE)), u.writeSource(BASE));
  const x = await wermaid.render(el, BASE, { id: 't5', defaultTheme: 'acme' });
  ok('theme: defaultTheme when block names none', x.theme === 'acme', x.theme);
  const y = await wermaid.render(el, BASE + '\n%% @layout\n%% @theme pele\n%% @end', { id: 't6', defaultTheme: 'acme' });
  ok('theme: block beats defaultTheme', y.theme === 'pele', y.theme);
  const z = await wermaid.render(el, BASE + '\n%% @layout\n%% @theme nope\n%% @end', { id: 't6b', defaultTheme: 'acme' });
  ok('theme: unknown block name falls back to defaultTheme', z.theme === 'acme' && z.warnings.some((w) => w.includes('using acme')), [z.theme, z.warnings]);
  const f = await wermaid.render(el, BASE + '\n%% @layout\n%% @theme pele\n%% @end', { id: 't6c', theme: 'wermaid', defaultTheme: 'acme' });
  ok('theme: theme option still forces', f.theme === 'wermaid', f.theme);
  defineTheme('peach', { extends: 'pele' });
  ok('theme: extends pele inherits its fill', fillOf(await wermaid.render(el, BASE, { id: 't7', theme: 'peach' })) === 'rgb(242, 240, 229)');
  defineTheme('mm', { extends: 'mermaid' });
  const m = await wermaid.render(el, BASE, { id: 't8', theme: 'mm' });
  const mFill = fillOf(m);
  const w = await wermaid.render(el, BASE, { id: 't9', theme: 'wermaid' });
  const wermaidRender = w;
  ok('theme: extends mermaid warns and uses wermaid', m.warnings.some((x) => x.includes('mermaid')) && mFill === fillOf(w), [m.warnings, mFill, fillOf(w)]);
  ok('theme: extends an Object.prototype name warns, not throws', (() => {
    try { defineTheme('proto', { extends: 'toString' }); } catch (e) { return e.message; }
    return getTheme('proto')?.warnings.some((x) => x.includes('"toString", which isn\'t defined'));
  })() === true);
  ok('theme: built-in names are protected', throws(() => defineTheme('pele', {})));
  ok('theme: bad names are rejected', throws(() => defineTheme('Acme', {})) && throws(() => defineTheme('9a', {})));
  ok('theme: spacing widens the layout', nodeGap(acmeRender) > nodeGap(wermaidRender), [nodeGap(acmeRender), nodeGap(wermaidRender)]);
  // A dark-on-dark light variant: its derived "dark" variant flips to a light canvas.
  defineTheme('night', { colors: { background: '#111111', text: '#eeeeee', muted: '#999999', line: '#cccccc', nodeFill: '#222222' } });
  const nk = getTheme('night').config({ dark: true }).themeVariables;
  const nightBg = getTheme('night').background(true);
  const lightSide = (c) => luminance(c) > 0.5;
  ok('theme: inverted dark keeps text contrast', contrast(nk.textColor, nightBg) >= 4.5 && contrast(nk.transitionLabelColor, nightBg) >= 3, [nightBg, nk.textColor, nk.transitionLabelColor]);
  ok('theme: inverted dark surfaces follow the background', [nk.edgeLabelBackground, nk.clusterBkg, nk.mainBkg].every((c) => lightSide(c) === lightSide(nightBg)), [nightBg, nk.edgeLabelBackground, nk.clusterBkg, nk.mainBkg]);
  const nl = getTheme('night').config({ dark: false }).themeVariables;
  ok('theme: unset surfaces follow a new light background', nl.clusterBkg === '#111111' && nl.edgeLabelBackground === '#111111', [nl.clusterBkg, nl.edgeLabelBackground]);
  // `@edges mermaid`: Mermaid's own curves, clearing the theme's edge default.
  defineTheme('square', { edges: { style: 'orthogonal' } });
  const sqSrc = BASE + '\n%% @layout\n%% @theme square\n%% @edges mermaid\n%% @end';
  const sq = await wermaid.render(el, sqSrc, { id: 't10' });
  ok('theme: @edges mermaid clears the theme edge style', sq.parseErrors.length === 0 && [...sq.geometry.edges.values()].every((g) => g.mode !== 'route'), [sq.parseErrors, [...sq.geometry.edges.values()].map((g) => g.mode)]);
  ok('theme: @edges mermaid round-trips', /%% @edges mermaid/.test(sq.writeSource(sqSrc)) && parseSource(sq.writeSource(sqSrc)).overrides.settings.edges.style === 'mermaid', sq.writeSource(sqSrc));
  ok('theme: per-edge style still rejects mermaid', parseSource(BASE + '\n%% @layout\n%% A->B style mermaid\n%% @end').errors.length === 1);
  const st = await wermaid.render(el, BASE + '\n%% @layout\n%% @theme square\n%% @end', { id: 't11' });
  ok('theme: square theme routes before showStock', [...st.geometry.edges.values()].some((g) => g.mode === 'route'));
  st.showStock();
  ok('theme: showStock ignores the theme edge style', [...st.geometry.edges.values()].every((g) => g.mode !== 'route'), [...st.geometry.edges.values()].map((g) => g.mode));
  // Mermaid turns ' into " inside %%{init}%% directives; a family with single quotes must survive it.
  defineTheme('courier', { font: { family: "'Courier New', monospace" }, colors: { nodeFill: '#ffeedd' } });
  const cr = await wermaid.render(el, BASE, { id: 't12', theme: 'courier' });
  ok('theme: a single-quoted font family keeps the theme', fillOf(cr) === 'rgb(255, 238, 221)' && /Courier New/.test(getComputedStyle(cr.svg.querySelector('g.node .nodeLabel, g.node text') || cr.svg).fontFamily), [fillOf(cr), getComputedStyle(cr.svg.querySelector('g.node .nodeLabel, g.node text') || cr.svg).fontFamily]);
  defineTheme('acme', { label: 'Acme 2', colors: { nodeFill: '#ddeeff' } });
  ok('theme: a custom theme may be redefined', getTheme('acme').label === 'Acme 2' && listThemes().filter((t) => t.name === 'acme').length === 1);
}
window.RESULTS = R;
