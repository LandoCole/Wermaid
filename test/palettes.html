<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"><style>body{margin:0;display:grid;grid-template-columns:1fr;gap:0} div{padding:16px}</style></head><body>
<div id="a"></div><div id="b"></div><div id="c"></div><div id="d" style="background:#100f0f"></div>
<script type="module">
import mermaid from '/mermaid-dist/mermaid.esm.min.mjs';
import { createWermaid, THEMES } from '/src/wermaid.js';
import { EXAMPLES } from '/src/examples.mjs';
mermaid.initialize({ startOnLoad: false });
const w = createWermaid(mermaid);
const src = EXAMPLES[0].source.replace('%% @layout v1', '%% @layout v1\n%% @edges rounded');
for (const [el, t, dark] of [[a,'mermaid',false],[b,'wermaid',false],[c,'pele',false],[d,'pele',true]]) {
  const r = await w.render(el, src, { id: 'p' + t + dark, theme: t, dark });
  if (t !== 'pele' || !dark) el.style.background = r.background;
}
window.RESULTS=[{name:'ok',pass:true}];
</script></body></html>
