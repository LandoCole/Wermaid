<title>Wermaid</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cstyle%3E*%7Bstroke:%231E1F22;fill:none%7D.a%7Bfill:%231E1F22;stroke:none%7D@media (prefers-color-scheme:dark)%7B*%7Bstroke:%23E7E7E3%7D.a%7Bfill:%23E7E7E3%7D%7D%3C/style%3E%3Cg stroke-width='6' stroke-linejoin='round'%3E%3Cpath d='M10 12 V45 Q10 50 15 50 H19 Q24 50 24 45 V33 Q24 28 29 28 H35 Q40 28 40 33 V45 Q40 50 45 50 H49 Q54 50 54 45 V16'/%3E%3Cpath class='a' d='M49 16 L54 6 L59 16 Z'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: a drafting sheet in two outlined plates (Source, Diagram). Each plate's title
     breaks into its hairline border, captions sit under the drawing like figure labels. */
  :root {
    --paper: #F9F9F7;
    --ink: #1E1F22;
    --graphite: #696A6F;
    --line: #BDBDC1;
    --line-strong: #8E8E93;
    --wash: rgba(30, 31, 34, 0.05);
    --warn: #8A5A12;
    --serif: "Michelangelus", "EB Garamond", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
    --gutter-l: max(16px, env(safe-area-inset-left, 0px));
    --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #151516; --ink: #E7E7E3; --graphite: #9B9CA0; --line: #3A3A3F; --line-strong: #67676D;
      --wash: rgba(231, 231, 227, 0.06); --warn: #E2B26A; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #151516; --ink: #E7E7E3; --graphite: #9B9CA0; --line: #3A3A3F; --line-strong: #67676D;
    --wash: rgba(231, 231, 227, 0.06); --warn: #E2B26A; color-scheme: dark;
  }

  html, body { height: 100%; }
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: var(--mono); font-size: 13px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    display: grid; grid-template-rows: auto auto minmax(0, 1fr); overflow: hidden;
  }
  button, select, input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 1px solid var(--ink); outline-offset: 2px; }

  /* ---- top bar: wordmark left, text actions right ---- */
  .topbar {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 24px;
    padding-block: 10px; padding-left: var(--gutter-l); padding-right: var(--gutter-r);
    border-bottom: 1px solid var(--line);
    font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase;
  }
  .wordmark { display: flex; align-items: center; gap: 10px; }
  .wordmark svg { width: 22px; height: 22px; flex: none; }
  .wordmark span { font-family: var(--serif); font-size: 21px; line-height: 1; letter-spacing: -0.01em; text-transform: none; }
  .actions { display: flex; flex-wrap: wrap; gap: 0 20px; }
  .text-btn {
    background: none; border: 0; padding: 6px 0; cursor: pointer; color: var(--ink);
    font: inherit; letter-spacing: inherit; text-transform: inherit; text-underline-offset: 4px;
  }
  .text-btn:hover:not(:disabled) { text-decoration: underline; text-decoration-thickness: 1px; }
  .text-btn:disabled { color: var(--graphite); opacity: 0.5; cursor: default; }

  /* ---- title row ---- */
  .titlerow {
    display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 32px;
    padding-block: 20px 4px; padding-left: var(--gutter-l); padding-right: var(--gutter-r);
  }
  .titlerow h1 { margin: 0; font-family: var(--serif); font-weight: 400; font-size: 34px; line-height: 1.05; letter-spacing: -0.01em; }
  /* The name is editable in place: a hairline under it on hover says so, a solid one while editing. */
  #title { width: fit-content; min-width: 4ch; cursor: text; outline: none; border-bottom: 1px solid transparent; padding-bottom: 2px; max-width: 100%; overflow-wrap: anywhere; }
  #title:hover { border-bottom-color: var(--line); }
  #title:focus { border-bottom-color: var(--ink); }
  .titlerow p { margin: 6px 0 0; font-family: var(--serif); font-style: italic; font-size: 18px; color: var(--graphite); }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
  .eyebrow { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--graphite); }
  .field-inline { display: flex; align-items: center; gap: 8px; }
  select.pick {
    appearance: none; -webkit-appearance: none; background: transparent; border: 0; border-bottom: 1px solid var(--line-strong);
    border-radius: 0; padding: 4px 18px 4px 0; cursor: pointer; font-size: 13px;
    background-image: linear-gradient(45deg, transparent 50%, var(--graphite) 50%), linear-gradient(135deg, var(--graphite) 50%, transparent 50%);
    background-position: calc(100% - 7px) 55%, calc(100% - 3px) 55%; background-size: 4px 4px; background-repeat: no-repeat;
  }
  select.pick option { background: var(--paper); color: var(--ink); }
  select.pick.small { font-size: 12px; padding-block: 1px; color: var(--ink); }
  .strip select.pick { font-size: 12px; padding-block: 1px; }
  .seg { display: inline-flex; outline: 1px solid var(--line-strong); outline-offset: -1px; }
  .seg button {
    border: 0; background: transparent; padding: 6px 12px; cursor: pointer;
    font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
  }
  .seg button + button { box-shadow: inset 1px 0 0 var(--line-strong); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .seg button:hover:not([aria-pressed="true"]) { background: var(--wash); }

  /* ---- plates ---- */
  main {
    display: grid; grid-template-columns: minmax(300px, 36%) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; gap: 28px;
    padding-block: 22px 16px; padding-left: var(--gutter-l); padding-right: var(--gutter-r);
    min-height: 0;
  }
  .plate { position: relative; border: 1px solid var(--line); display: grid; min-height: 0; min-width: 0; }
  .plate-title {
    position: absolute; top: -0.8em; left: 14px; right: 14px; z-index: 3; display: flex; justify-content: space-between; gap: 12px;
    pointer-events: none; line-height: 1.6;
  }
  .plate-title > * { background: var(--paper); padding: 0 8px; pointer-events: auto; }
  .plate-title h2 { margin: 0; font-size: 13px; font-weight: 500; }
  .plate-title .meta { color: var(--graphite); font-size: 12px; }

  .source { grid-template-rows: minmax(0, 1fr) auto; }
  #src {
    width: 100%; height: 100%; box-sizing: border-box; resize: none; border: 0; background: transparent; margin: 0;
    font-family: var(--mono); font-size: 12.5px; line-height: 22px; tab-size: 2; color: var(--ink);
    padding: 22px 16px 16px; white-space: pre; overflow: auto; min-height: 0;
  }
  #src:focus-visible { outline: none; box-shadow: inset 0 0 0 1px var(--line-strong); }
  .messages { border-top: 1px solid var(--line); font-size: 12px; max-height: 28vh; overflow: auto; }
  .messages:empty { display: none; }
  .msg { padding: 8px 16px; color: var(--warn); }
  .msg + .msg { border-top: 1px solid var(--line); }
  .msg::before { content: "! "; }
  .msg code { font-family: var(--mono); color: var(--graphite); }

  .canvas { grid-template-rows: minmax(0, 1fr) auto; }
  .tools { display: flex; align-items: center; gap: 12px; }
  .tools label, .tools-label { display: flex; align-items: center; gap: 6px; color: var(--graphite); font-size: 12px; cursor: pointer; }
  .tools input[type="checkbox"] { accent-color: var(--ink); margin: 0; }
  .zoom { display: flex; align-items: center; gap: 2px; }
  .zoom button { border: 0; background: none; cursor: pointer; padding: 0 5px; color: var(--graphite); font-size: 13px; }
  .zoom button:hover { color: var(--ink); }
  .zoom output { font-size: 12px; min-width: 4.5ch; text-align: center; font-variant-numeric: tabular-nums; color: var(--graphite); }

  /* Canvas: the drawing floats in an unbounded viewport, moved with a transform. */
  .sheet-wrap { position: relative; overflow: hidden; min-height: 0; background: var(--sheet-bg, transparent); cursor: grab; touch-action: none; }
  .sheet-wrap.panning, .sheet-wrap.panning * { cursor: grabbing !important; }
  #sheet { position: absolute; left: 0; top: 0; transform-origin: 0 0; user-select: none; -webkit-user-select: none; }
  #sheet svg { display: block; overflow: visible; }
  #sheet.editable svg g.node, #sheet.editable svg g.edgeLabel { cursor: move; }
  #sheet.editable svg g.cluster > rect, #sheet.editable svg .statediagram-cluster rect { cursor: move; }
  #sheet.dragging, #sheet.dragging * { cursor: grabbing !important; }
  #sheet.editable svg g.node, #sheet.editable svg g.edgeLabel, .wm-hit, .wm-overlay .h { touch-action: none; }
  .wm-hit { fill: none; stroke: transparent; stroke-width: 12px; pointer-events: stroke; cursor: crosshair; }
  .wm-overlay .sel { fill: none; stroke: var(--ink); stroke-width: 1px; stroke-dasharray: 3 3; vector-effect: non-scaling-stroke; pointer-events: none; }
  .wm-overlay .edge-sel { fill: none; stroke: var(--ink); stroke-width: 5px; opacity: 0.12; vector-effect: non-scaling-stroke; pointer-events: none; }
  .wm-overlay .h { fill: var(--paper); stroke: var(--ink); stroke-width: 1px; vector-effect: non-scaling-stroke; }
  .wm-overlay .h.corner { cursor: nwse-resize; }
  .wm-overlay .h.corner.ne, .wm-overlay .h.corner.sw { cursor: nesw-resize; }
  .wm-overlay .h.via { fill: var(--ink); cursor: move; }
  .wm-overlay .h.add { cursor: copy; }
  .wm-overlay .pin { fill: var(--ink); pointer-events: none; }
  .wm-overlay .pin.hollow { fill: var(--paper); stroke: var(--ink); stroke-width: 1px; vector-effect: non-scaling-stroke; }

  .notice { position: absolute; left: 0; right: 0; top: 0; z-index: 2; margin: 0; padding: 22px 16px 0; font-size: 12px; color: var(--warn); pointer-events: none; }

  .strip {
    display: flex; align-items: center; flex-wrap: wrap; gap: 6px 16px; min-height: 42px; box-sizing: border-box;
    padding: 6px 16px; border-top: 1px solid var(--line); font-size: 12px; color: var(--graphite);
  }
  .strip .sel-name { color: var(--ink); font-weight: 500; }
  .strip .kind { font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; }
  .strip .state { color: var(--ink); }
  .strip .field { display: flex; align-items: center; gap: 6px; }
  .strip .field input {
    width: 7ch; padding: 3px 0; border: 0; border-bottom: 1px solid var(--line-strong); border-radius: 0; background: transparent;
    font-size: 12px; font-variant-numeric: tabular-nums;
  }
  .strip .hint { flex: 1 1 280px; min-width: 0; }
  .btn {
    border: 0; outline: 1px solid var(--line-strong); outline-offset: -1px; background: transparent; cursor: pointer;
    padding: 5px 10px; font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink);
  }
  .btn:hover { background: var(--ink); color: var(--paper); outline-color: var(--ink); }
  kbd { font-family: var(--mono); font-size: 11px; padding: 0 4px; outline: 1px solid var(--line); outline-offset: -1px; color: var(--ink); }

  .figcap {
    grid-column: 2; display: flex; justify-content: space-between; gap: 8px 24px; flex-wrap: wrap;
    margin-top: -18px; font-size: 11px; letter-spacing: 0.06em; color: var(--graphite);
  }
  .figcap .coords { font-variant-numeric: tabular-nums; }
  /* Thanks to whoever a palette came from, on its own line while that palette is shown. */
  .figcap .credit { flex-basis: 100%; letter-spacing: 0.02em; }
  .figcap .credit a { color: var(--ink); text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
  .figcap .credit a:hover { text-decoration-color: var(--ink); }

  .menu-wrap { position: relative; }
  .menu {
    position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; min-width: 220px;
    display: grid; padding: 4px 0; background: var(--paper); border: 1px solid var(--line-strong);
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.08); text-transform: none; letter-spacing: 0;
  }
  .menu button {
    background: none; border: 0; text-align: left; padding: 8px 14px; cursor: pointer; color: var(--ink);
    font: inherit; font-size: 12px; letter-spacing: 0.04em;
  }
  .menu button:hover, .menu button:focus-visible { background: var(--wash); outline: none; }
  .menu-sep { height: 1px; margin: 4px 0; background: var(--line); }
  .toast {
    position: fixed; right: var(--gutter-r); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    background: var(--ink); color: var(--paper); padding: 8px 12px; font-size: 12px;
    opacity: 0; transform: translateY(6px); transition: opacity .15s, transform .15s; pointer-events: none;
  }
  .toast.on { opacity: 1; transform: none; }

  @media (max-width: 860px) {
    body { height: auto; min-height: 100%; overflow: visible; grid-template-rows: auto auto auto; }
    main { grid-template-columns: minmax(0, 1fr); grid-template-rows: 46vh 72vh auto; gap: 28px; }
    .figcap { grid-column: 1; grid-row: 3; margin-top: -18px; }

    .plate-title { flex-wrap: wrap; row-gap: 2px; }
    .tools { flex-wrap: wrap; gap: 2px 12px; }
  }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>

<header class="topbar">
  <div class="wordmark">
    <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="4" width="8" height="8"/><path d="M10 12 V45 Q10 50 15 50 H19 Q24 50 24 45 V33 Q24 28 29 28 H35 Q40 28 40 33 V45 Q40 50 45 50 H49 Q54 50 54 45 V16"/><path d="M50.5 15 L54 8 L57.5 15 Z" fill="currentColor" stroke="none"/></svg>
    <span>Wermaid</span>
  </div>
  <nav class="actions" aria-label="Actions">
    <button id="undo" class="text-btn" type="button" title="Ctrl/⌘ Z">Undo</button>
    <button id="redo" class="text-btn" type="button" title="Shift Ctrl/⌘ Z">Redo</button>
    <button id="reset-all" class="text-btn" type="button">Clear overrides</button>
    <button id="copy-src" class="text-btn" type="button">Copy source</button>
    <div class="menu-wrap">
      <button id="export-btn" class="text-btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="export-menu">Export ▾</button>
      <div id="export-menu" class="menu" role="menu" aria-label="Export" hidden>
        <button type="button" role="menuitem" data-export="copy-png">Copy as PNG</button>
        <button type="button" role="menuitem" data-export="copy-svg">Copy as SVG</button>
        <div class="menu-sep" role="separator"></div>
        <button type="button" role="menuitem" data-export="save-png">Save as PNG…</button>
        <button type="button" role="menuitem" data-export="save-svg">Save as SVG…</button>
        <button type="button" role="menuitem" data-export="save-md">Save as Markdown…</button>
      </div>
    </div>
  </nav>
</header>

<section class="titlerow">
  <div>
    <h1 id="title" contenteditable="plaintext-only" spellcheck="false" role="textbox" aria-label="Diagram name" title="Rename: names exported files">Wermaid</h1>
    <p>Mermaid lays it out. You nudge what needs it.</p>
  </div>
  <div class="controls">
    <div class="seg" role="group" aria-label="Layout shown">
      <button id="mode-stock" type="button" aria-pressed="false" title="Show Mermaid's own layout">Stock</button>
      <button id="mode-wermaid" type="button" aria-pressed="true" title="Show the layout with your overrides">With overrides</button>
    </div>
  </div>
</section>

<main>
  <section class="plate source" aria-label="Source">
    <div class="plate-title">
      <h2>Source</h2>
      <label class="tools-label" for="example">Example
        <select id="example" class="pick small"></select>
      </label>
    </div>
    <textarea id="src" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Mermaid source with layout block"></textarea>
    <div id="messages" class="messages" aria-live="polite"></div>
  </section>

  <section class="plate canvas" aria-label="Diagram">
    <div class="plate-title">
      <h2>Diagram</h2>
      <div class="tools">
        <label for="palette">Palette
          <select id="palette" class="pick small" title="Colours and type for the diagram"></select>
        </label>
        <label for="edge-style">Edges
          <select id="edge-style" class="pick small" title="How edges are drawn">
            <option value="">Mermaid</option>
            <option value="rounded">Rounded</option>
            <option value="orthogonal">Orthogonal</option>
            <option value="curved">Curved</option>
          </select>
        </label>
        <label for="snap"><input id="snap" type="checkbox" checked> Snap 8</label>
        <div class="zoom">
          <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
          <output id="zoom-val">100%</output>
          <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
          <button id="zoom-fit" type="button">Fit</button>
        </div>
      </div>
    </div>
    <div class="sheet-wrap" id="sheet-wrap">
      <p class="notice" id="notice" hidden></p>
      <div id="sheet"></div>
    </div>
    <div class="strip" id="strip"></div>
  </section>
  <div class="figcap"><span id="figcap">Fig. 1</span><span class="coords" id="coords"></span><span class="credit" id="palette-credit" hidden></span></div>
</main>
<div class="toast" id="toast" role="status"></div>

<script type="module">
/*__WERMAID_LIBRARY__*/

/* ================================================================== */
/* Editor                                                              */
/* ================================================================== */

const MERMAID_URL = new URLSearchParams(location.search).get('mermaid')
  || 'https://cdn.jsdelivr.net/npm/mermaid@11.16.1/dist/mermaid.esm.min.mjs';
const { default: mermaid } = await import(MERMAID_URL);

const EXAMPLES = /*__WERMAID_EXAMPLES__*/;

const $ = (id) => document.getElementById(id);
const srcEl = $('src'), sheet = $('sheet'), wrap = $('sheet-wrap'), strip = $('strip');
const DRAFT_KEY = 'wermaid:draft:v1';

const wermaid = createWermaid(mermaid);
let diagram = null;          // current render
let renderedBody = null;     // Mermaid body the current render came from
let showStock = false;
let zoom = 1;
let renderSeq = 0;
const undoHistory = createHistory(200);

/* Editing (dragging, resizing, bends, keys) lives in edit.js; the page shows the result. */
const ed = createEditor(sheet, {
  snap: () => $('snap').checked,
  scale: () => zoom,
  onPreview: () => { showState(); writeBack(); },
  onCommit: () => { showState(); writeBack({ commit: true }); },
  onSelect: () => renderStrip(),
});
/** Redraw the selection handles at the current zoom (select() redraws the overlay). */
const redrawOverlay = () => ed.select(ed.selection);
/** A shape is being dragged: the view holds still until it ends. */
const shapeDragging = () => sheet.classList.contains('dragging');

/* ---------- theme ---------- */
const darkQuery = matchMedia('(prefers-color-scheme: dark)');
const isDark = () => {
  const t = document.documentElement.dataset.theme;
  return t ? t === 'dark' : darkQuery.matches;
};
mermaid.initialize({ startOnLoad: false, securityLevel: 'strict' });
let renderedDark = isDark();
// Palettes have light and dark variants, so a theme switch re-renders.
const rethemed = () => { if (isDark() !== renderedDark) { renderedBody = null; refresh(srcEl.value); } };
darkQuery.addEventListener('change', rethemed);
new MutationObserver(rethemed).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

/* ---------- storage (per-viewer draft) ---------- */
const store = {
  get() { try { return JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); } catch { return null; } },
  set(v) { try { localStorage.setItem(DRAFT_KEY, JSON.stringify(v)); } catch { /* storage unavailable */ } },
};

/* ---------- examples ---------- */
const exSel = $('example');
for (const [i, ex] of EXAMPLES.entries()) exSel.add(new Option(ex.name, String(i)));
exSel.add(new Option('Your draft', 'draft'));
exSel.addEventListener('change', () => {
  if (exSel.value === 'draft') return;
  const ex = EXAMPLES[+exSel.value];
  loadSource(ex.source, { resetHistory: true });
});

/* ---------- palettes ---------- */
const paletteSel = $('palette');
for (const [name, t] of Object.entries(THEMES)) paletteSel.add(new Option(t.label, name));
paletteSel.value = DEFAULT_THEME;
const fontsReady = new Map();
/** Mermaid measures text when it lays out, so a palette's font must be loaded first. */
function ensureFonts(name) {
  const faces = THEMES[name]?.fonts || [];
  if (!faces.length) return Promise.resolve();
  if (!fontsReady.has(name)) {
    fontsReady.set(name, Promise.race([
      Promise.all(faces.map((f) => document.fonts.load(f))).catch(() => {}),
      new Promise((resolve) => setTimeout(resolve, 2500)),
    ]));
  }
  return fontsReady.get(name);
}
paletteSel.addEventListener('change', () => {
  if (!diagram) return;
  const { overrides } = ed;
  overrides.settings = overrides.settings || {};
  if (paletteSel.value === DEFAULT_THEME) delete overrides.settings.theme;
  else overrides.settings.theme = paletteSel.value;
  writeBack({ commit: true });
  refresh(srcEl.value);
});

/* ---------- source ⇄ diagram ---------- */
let inputTimer = 0;
srcEl.addEventListener('input', () => {
  clearTimeout(inputTimer);
  inputTimer = setTimeout(() => {
    pushUndo(lastCommitted);
    lastCommitted = srcEl.value;
    exSel.value = 'draft';
    showName();
    if (!srcEl.value.trim()) $('figcap').textContent = `Fig. 1 · ${exampleName()}, empty`;
    refresh(srcEl.value);
  }, 280);
});
let lastCommitted = '';

async function loadSource(text, { resetHistory } = {}) {
  srcEl.value = text;
  if (resetHistory) { undoHistory.clear(); updateUndoButtons(); }
  lastCommitted = text;
  ed.select(null);
  renderedBody = null;
  await refresh(text);
  fitToSheet({ max: 1 });
}

async function refresh(text) {
  const parsed = parseSource(text);
  store.set({ source: text, example: exSel.value });
  const palette = parsed.overrides.settings.theme || DEFAULT_THEME;
  const renderKey = `${parsed.body}\u0000${palette}\u0000${isDark()}`;
  if (diagram && renderKey === renderedBody) {
    ed.attach(diagram, parsed.overrides);
    showState();
    showMessages(parsed.errors);

  const seq = ++renderSeq;

    return;

  // so a failed render never blanks the sheet.
  const staging = document.createElement('div');
  sheet.append(staging);

    await ensureFonts(palette);
    next = await wermaid.render(staging, text, { id: `wm-d${seq}`, theme: palette, dark: isDark() });

  showCredit(palette);

  wrap.style.setProperty('--sheet-bg', palette === DEFAULT_THEME ? 'transparent' : diagram.background || 'transparent');

  ed.attach(diagram, diagram.overrides);
  showState();

  notice.textContent = diagram.supported ? '' :

/** The page's side of showing the overrides: edge picker, drawing size, strip, caption, warnings. */

}

/** Apply a change the page made to the overrides and record it. */

/* ---------- undo ---------- */

/* ---------- messages ---------- */

}

/* ---------- sizing & zoom ---------- */
/*
 * The view: `zoom` scales the drawing (the SVG is drawn at that size, so it stays crisp)
 * and `view` is where the drawing's top-left corner sits in the viewport, in pixels.
 * A diagram point d appears at view + (d - viewBox origin) * zoom.
 */
const view = { x: 0, y: 0 };
let lastVB = null;
const MIN_ZOOM = 0.1, MAX_ZOOM = 4;
function applyView() {

  // shape is being dragged: the diagram grows under the pointer, and moving the view then would
  // feed back into the drag. The drag's last apply() clamps.
  const svg = diagram?.svg;

    const vb = svg.viewBox.baseVal, narrow = wrap.clientWidth < 600;
    const side = narrow ? 16 : 32;
    Object.assign(view, clampView(view, { width: vb.width * zoom, height: vb.height * zoom },
      { width: wrap.clientWidth, height: wrap.clientHeight },
      { inset: { top: narrow ? 84 : 48, right: side, bottom: side, left: side } }));

}
function sizeSvg() {

  // other way so the drawing stays put on screen.
  if (lastVB && (vb.x !== lastVB.x || vb.y !== lastVB.y)) {
    view.x += (vb.x - lastVB.x) * zoom;
    view.y += (vb.y - lastVB.y) * zoom;
  }
  lastVB = { x: vb.x, y: vb.y };

  svg.setAttribute('width', String(Math.round(vb.width * zoom)));
  svg.setAttribute('height', String(Math.round(vb.height * zoom)));

  applyView();
}
/** Zoom to `z`, keeping the viewport point (ax, ay) fixed (default: the centre). */
function setZoom(z, ax = wrap.clientWidth / 2, ay = wrap.clientHeight / 2) {
  const next = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, z));
  view.x = ax - (ax - view.x) * (next / zoom);
  view.y = ay - (ay - view.y) * (next / zoom);

}
$('zoom-in').addEventListener('click', () => setZoom(zoom * 1.25));
$('zoom-out').addEventListener('click', () => setZoom(zoom / 1.25));
/** Scale the drawing to fit the viewport and centre it. */
function fitToSheet({ max = 1.5 } = {}) {
  if (!diagram) return;
  const vb = diagram.svg.viewBox.baseVal;
  const narrow = wrap.clientWidth < 600;
  const top = narrow ? 84 : 48, side = narrow ? 16 : 32;
  zoom = Math.max(MIN_ZOOM, Math.min((wrap.clientWidth - 2 * side) / vb.width, (wrap.clientHeight - top - side) / vb.height, max));
  view.x = (wrap.clientWidth - vb.width * zoom) / 2;
  view.y = top + (wrap.clientHeight - top - side - vb.height * zoom) / 2;

$('zoom-fit').addEventListener('click', () => fitToSheet());
new ResizeObserver(() => { if (diagram) { applyView(); redrawOverlay(); } }).observe(wrap);

/* Wheel: two-finger scroll or the mouse wheel pans; pinch or Ctrl/⌘ + wheel zooms at the cursor. */
wrap.addEventListener('wheel', (ev) => {
  if (!diagram) return;
  ev.preventDefault();
  const unit = ev.deltaMode === 1 ? 16 : ev.deltaMode === 2 ? wrap.clientHeight : 1;
  const r = wrap.getBoundingClientRect();
  if (ev.ctrlKey || ev.metaKey) {

    view.x -= (ev.shiftKey && !ev.deltaX ? ev.deltaY : ev.deltaX) * unit;

/* ---------- instrument strip ---------- */
function renderStrip() {

    strip.append(span('hint', 'Showing Mermaid’s own layout. Switch to “With overrides” to edit.'));
    return;
  }
  if (!diagram.supported) {
    strip.append(span('hint', 'Editing is off for this diagram type.'));
    return;
  }
  const { selection } = ed;
  if (!selection) {
    const hint = span('hint', '');
    hint.innerHTML = 'Drag a shape to nudge it from its auto-layout spot; <kbd>Alt</kbd>-drag pins it in place. Drag a corner to resize, a line to bend it (double-click a bend to remove it), a subgraph’s frame to move everything inside, the background to pan; pinch or <kbd>Ctrl</kbd>/<kbd>⌘</kbd>-scroll to zoom. <kbd>←↑→↓</kbd> nudge · <kbd>Del</kbd> resets.';
    strip.append(hint);
    return;
  }
  const geom = diagram.geometry;
  strip.append(span('kind', selection.kind === 'cluster' ? 'subgraph' : selection.kind));
  const ov = ed.overrides.targets.get(selection.kind === 'edge' ? `edge:${selection.id}` : selection.id);
  const field = (label, value, onSet) => {
    const wrapEl = document.createElement('label');
    wrapEl.className = 'field';
    const id = `f-${label}`;
    wrapEl.htmlFor = id;
    wrapEl.append(label);
    const input = document.createElement('input');
    input.id = id; input.type = 'number'; input.step = '1'; input.value = String(Math.round(value * 10) / 10);
    input.addEventListener('change', () => { const v = parseFloat(input.value); if (Number.isFinite(v)) onSet(v); });
    wrapEl.append(input);
    strip.append(wrapEl);
  };
  if (selection.kind === 'node') {
    const id = selection.id;
    strip.append(span('sel-name', id));
    const n = geom.nodes.get(id);
    const pinned = !!ov?.at;
    const nudge = ov?.nudge || { x: 0, y: 0 };
    strip.append(span('state', pinned ? 'pinned' : (nudge.x || nudge.y) ? 'nudged' : 'auto layout'));
    // Typed positions move the shape by the difference, so a pin stays a pin and a nudge a nudge.
    if (pinned) {
      field('x', n.box.cx, (v) => ed.nudge(v - n.box.cx, 0));
      field('y', n.box.cy, (v) => ed.nudge(0, v - n.box.cy));
    } else {
      field('dx', nudge.x, (v) => ed.nudge(v - nudge.x, 0));

    toggle.className = 'btn'; toggle.type = 'button';
    toggle.textContent = pinned ? 'Unpin' : 'Pin here';
    toggle.title = pinned

      : 'Fix this shape at its current coordinates, whatever the auto layout does';
    toggle.addEventListener('click', () => (pinned ? ed.unpin() : ed.pin()));

    strip.append(span('sel-name', selection.id));

    field('dy', c.offset.y, (v) => ed.nudge(0, v - c.offset.y));

    const e = diagram.scene.edges.get(selection.id);
    strip.append(span('sel-name', `${e.start} → ${e.end}`));
    const via = ov?.via?.length || 0;
    strip.append(span('', via ? `${via} bend${via === 1 ? '' : 's'}` : 'auto route'));
    if (ov?.label) strip.append(span('', `label moved ${Math.round(ov.label.x)}, ${Math.round(ov.label.y)}`));
    const wrapEl = document.createElement('label');
    wrapEl.className = 'field';
    wrapEl.htmlFor = 'f-edge-style';
    wrapEl.append('style');
    const sel = document.createElement('select');
    sel.id = 'f-edge-style'; sel.className = 'pick';
    for (const [v, t] of [['', 'Diagram default'], ['rounded', 'Rounded'], ['orthogonal', 'Orthogonal'], ['curved', 'Curved']]) sel.add(new Option(t, v));
    sel.value = ov?.style || '';
    const edgeId = selection.id;
    sel.addEventListener('change', () => ed.setEdgeStyle(edgeId, sel.value || null));
    wrapEl.append(sel);
    strip.append(wrapEl);
  }
  if (ov && (ov.at || ov.nudge || ov.size || ov.via?.length || ov.label || ov.style)) {
    const b = document.createElement('button');
    b.className = 'btn'; b.type = 'button'; b.textContent = 'Reset this';
    b.addEventListener('click', () => ed.resetSelection());
    strip.append(b);
  }
}
function showCoords(p) {
  $('coords').textContent = p ? `x ${Math.round(p.x)}  y ${Math.round(p.y)}` : '';
}

/** The name a diagram has without an `@title`: the example's own, else `my-wermaid`. */
const DEFAULT_NAME = 'my-wermaid';

  return exSel.value === 'draft' ? DEFAULT_NAME : exSel.selectedOptions[0]?.textContent || DEFAULT_NAME;
}
/**
 * The diagram's name: the layout block's `@title`, else the default. Names exported files.

}
/** Show the current name, unless the person is typing one. */
function showName() {

}
function updateCaption(count) {

  showName();

  $('figcap').textContent = `Fig. 1 · ${name}, ${state}`;

/* ---------- pointer coordinates ---------- */
sheet.addEventListener('pointermove', (ev) => {
  if (diagram?.svg) showCoords(diagram.toDiagram(ev.clientX, ev.clientY));
});

/* ---------- panning: press and hold the background (or use the middle button anywhere) ---------- */
let pan = null;
const touches = new Map(); // touch pointers on the background, for one-finger pan and pinch
let pinch = null;
function startPinch() {

    dist: Math.hypot(p2.x - p1.x, p2.y - p1.y),
    mid: { x: (p1.x + p2.x) / 2 - r.left, y: (p1.y + p2.y) / 2 - r.top },

    touches.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });

/* ---------- keyboard ---------- */

/* Rename: the name is stored as `%% @title …` in the layout block, so it travels with the source. */

/* ---------- export ---------- */

  el.hidden = !credit;

  if (!credit) return;
  el.append(`${credit.text} · `);
  credit.links.forEach((l, i) => {

  });

/** What the drawing sits on: the palette's ground, else the page's paper. */

  const sheetBg = getComputedStyle(wrap).backgroundColor;

const exportSvgText = () => diagram.toSVG();
const exportPng = () => diagram.toPNG({ background: exportBackground() });

/** Offer a file: through the viewer's save prompt inside Claude, a plain download elsewhere. */
async function saveFile(filename, data) {
  const framed = window.top !== window;
  const downloads = window.claude?.use ? await window.claude.use('downloads') : null;
  if (downloads) {
    try {
      await downloads.save({ filename, data });
      toast(`Saved ${filename}`);
    } catch (err) {
      if (err?.code === 'declined') return;
      toast(err?.code === 'rate_limited' ? 'A save is already waiting for an answer.' : 'Saving isn’t available here.');
    }
    return;
  }
  if (framed) { toast('Saving isn’t available here. Copy instead.'); return; }
  const url = URL.createObjectURL(data instanceof Blob ? data : new Blob([data]));
  const a = Object.assign(document.createElement('a'), { href: url, download: filename });
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  toast(`Saved ${filename}`);
}

async function runExport(kind) {
  if (!diagram) return;

      await copyText(exportSvgText(), 'SVG copied');
    } else if (kind === 'copy-png') {
      if (!window.ClipboardItem || !navigator.clipboard?.write) { toast('This browser can’t copy images. Use Save as PNG.'); return; }
      // Hand the clipboard a promise so the copy still counts as part of the click.
      await navigator.clipboard.write([new ClipboardItem({ 'image/png': exportPng() })]);
      toast('PNG copied');
    } else if (kind === 'save-png') {
      await saveFile(`${slug()}.png`, await exportPng());
    } else if (kind === 'save-svg') {
      await saveFile(`${slug()}.svg`, new Blob([exportSvgText()], { type: 'image/svg+xml' }));
    } else if (kind === 'save-md') {
      const md = `# ${exampleName()}\n\n\`\`\`mermaid\n${srcEl.value.replace(/\s+$/, '')}\n\`\`\`\n`;
      await saveFile(`${slug()}.md`, md);
    }
  } catch (err) {
    toast(err?.name === 'SecurityError'
      ? 'This browser won’t turn these labels into an image. Try Chrome, or use SVG.'
      : kind === 'copy-png' ? 'Copy was blocked here. Use Save as PNG.' : 'Export failed. Try again.');
  }
}

const exportBtn = $('export-btn'), exportMenu = $('export-menu');
function setMenu(open) {
  exportMenu.hidden = !open;
  exportBtn.setAttribute('aria-expanded', String(open));
  if (open) exportMenu.querySelector('button')?.focus();
}
exportBtn.addEventListener('click', () => setMenu(exportMenu.hidden));
exportMenu.addEventListener('click', (ev) => {
  const item = ev.target.closest('[data-export]');
  if (!item) return;
  setMenu(false);
  runExport(item.dataset.export);
});
exportMenu.addEventListener('keydown', (ev) => {
  const items = [...exportMenu.querySelectorAll('button')];
  const i = items.indexOf(document.activeElement);
  if (ev.key === 'ArrowDown') { ev.preventDefault(); items[(i + 1) % items.length].focus(); }
  if (ev.key === 'ArrowUp') { ev.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
  if (ev.key === 'Escape') { setMenu(false); exportBtn.focus(); }
});
document.addEventListener('pointerdown', (ev) => {
  if (!exportMenu.hidden && !ev.target.closest('.menu-wrap')) setMenu(false);
});

/* ---------- boot ---------- */
updateUndoButtons();

const saved = store.get();
if (saved?.source) {
  exSel.value = saved.example && exSel.querySelector(`option[value="${saved.example}"]`) ? saved.example : 'draft';
  await loadSource(saved.source, { resetHistory: true });
} else {
  exSel.value = '0';
  await loadSource(EXAMPLES[0].source, { resetHistory: true });
}
window.READY = true;
</script>
