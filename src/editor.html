<title>Wermaid</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: a drafting sheet in two outlined plates (Source, Diagram). Each plate's title
     breaks into its hairline border, captions sit under the drawing like figure labels. */
  :root {
    --paper: #F9F9F7;
    --ink: #1E1F22;
    --graphite: #696A6F;
    --line: #BDBDC1;
    --line-strong: #8E8E93;
    --wash: rgba(30, 31, 34, 0.05);
    --warn: #8A5A12;
    --serif: "Michelangelus", "EB Garamond", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
    --gutter-l: max(16px, env(safe-area-inset-left, 0px));
    --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #151516; --ink: #E7E7E3; --graphite: #9B9CA0; --line: #3A3A3F; --line-strong: #67676D;
      --wash: rgba(231, 231, 227, 0.06); --warn: #E2B26A; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #151516; --ink: #E7E7E3; --graphite: #9B9CA0; --line: #3A3A3F; --line-strong: #67676D;
    --wash: rgba(231, 231, 227, 0.06); --warn: #E2B26A; color-scheme: dark;
  }

  html, body { height: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: var(--mono); font-size: 13px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    display: grid; grid-template-rows: auto auto minmax(0, 1fr); overflow: hidden;
  }
  button, select, input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 1px solid var(--ink); outline-offset: 2px; }

  /* ---- top bar: wordmark left, text actions right ---- */
  .topbar {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 24px;
    padding-block: 10px; padding-left: var(--gutter-l); padding-right: var(--gutter-r);
    border-bottom: 1px solid var(--line);
    font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase;
  }
  .wordmark { display: flex; align-items: center; gap: 10px; font-weight: 500; }
  .wordmark svg { width: 16px; height: 16px; flex: none; }
  .actions { display: flex; flex-wrap: wrap; gap: 0 20px; }
  .text-btn {
    background: none; border: 0; padding: 6px 0; cursor: pointer; color: var(--ink);
    font: inherit; letter-spacing: inherit; text-transform: inherit; text-underline-offset: 4px;
  }
  .text-btn:hover:not(:disabled) { text-decoration: underline; text-decoration-thickness: 1px; }
  .text-btn:disabled { color: var(--graphite); opacity: 0.5; cursor: default; }

  /* ---- title row ---- */
  .titlerow {
    display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 32px;
    padding-block: 20px 4px; padding-left: var(--gutter-l); padding-right: var(--gutter-r);
  }
  .titlerow h1 { margin: 0; font-family: var(--serif); font-weight: 400; font-size: 34px; line-height: 1.05; letter-spacing: -0.01em; }
  .titlerow p { margin: 6px 0 0; font-family: var(--serif); font-style: italic; font-size: 18px; color: var(--graphite); }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
  .eyebrow { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--graphite); }
  .field-inline { display: flex; align-items: center; gap: 8px; }
  select.pick {
    appearance: none; -webkit-appearance: none; background: transparent; border: 0; border-bottom: 1px solid var(--line-strong);
    border-radius: 0; padding: 4px 18px 4px 0; cursor: pointer; font-size: 13px;
    background-image: linear-gradient(45deg, transparent 50%, var(--graphite) 50%), linear-gradient(135deg, var(--graphite) 50%, transparent 50%);
    background-position: calc(100% - 7px) 55%, calc(100% - 3px) 55%; background-size: 4px 4px; background-repeat: no-repeat;
  }
  select.pick option { background: var(--paper); color: var(--ink); }
  select.pick.small { font-size: 12px; padding-block: 1px; color: var(--ink); }
  .strip select.pick { font-size: 12px; padding-block: 1px; }
  .seg { display: inline-flex; outline: 1px solid var(--line-strong); outline-offset: -1px; }
  .seg button {
    border: 0; background: transparent; padding: 6px 12px; cursor: pointer;
    font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
  }
  .seg button + button { box-shadow: inset 1px 0 0 var(--line-strong); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .seg button:hover:not([aria-pressed="true"]) { background: var(--wash); }

  /* ---- plates ---- */
  main {
    display: grid; grid-template-columns: minmax(300px, 36%) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; gap: 28px;
    padding-block: 22px 16px; padding-left: var(--gutter-l); padding-right: var(--gutter-r);
    min-height: 0;
  }
  .plate { position: relative; border: 1px solid var(--line); display: grid; min-height: 0; min-width: 0; }
  .plate-title {
    position: absolute; top: -0.8em; left: 14px; right: 14px; z-index: 3; display: flex; justify-content: space-between; gap: 12px;
    pointer-events: none; line-height: 1.6;
  }
  .plate-title > * { background: var(--paper); padding: 0 8px; pointer-events: auto; }
  .plate-title h2 { margin: 0; font-size: 13px; font-weight: 500; }
  .plate-title .meta { color: var(--graphite); font-size: 12px; }

  .source { grid-template-rows: minmax(0, 1fr) auto; }
  #src {
    width: 100%; height: 100%; box-sizing: border-box; resize: none; border: 0; background: transparent; margin: 0;
    font-family: var(--mono); font-size: 12.5px; line-height: 22px; tab-size: 2; color: var(--ink);
    padding: 22px 16px 16px; white-space: pre; overflow: auto; min-height: 0;
  }
  #src:focus-visible { outline: none; box-shadow: inset 0 0 0 1px var(--line-strong); }
  .messages { border-top: 1px solid var(--line); font-size: 12px; max-height: 28vh; overflow: auto; }
  .messages:empty { display: none; }
  .msg { padding: 8px 16px; color: var(--warn); }
  .msg + .msg { border-top: 1px solid var(--line); }
  .msg::before { content: "! "; }
  .msg code { font-family: var(--mono); color: var(--graphite); }

  .canvas { grid-template-rows: minmax(0, 1fr) auto; }
  .tools { display: flex; align-items: center; gap: 12px; }
  .tools label { display: flex; align-items: center; gap: 6px; color: var(--graphite); font-size: 12px; cursor: pointer; }
  .tools input[type="checkbox"] { accent-color: var(--ink); margin: 0; }
  .zoom { display: flex; align-items: center; gap: 2px; }
  .zoom button { border: 0; background: none; cursor: pointer; padding: 0 5px; color: var(--graphite); font-size: 13px; }
  .zoom button:hover { color: var(--ink); }
  .zoom output { font-size: 12px; min-width: 4.5ch; text-align: center; font-variant-numeric: tabular-nums; color: var(--graphite); }

  .sheet-wrap { position: relative; overflow: auto; min-height: 0; }
  #sheet { padding: 44px 36px 36px; width: max-content; min-width: 100%; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  #sheet svg { display: block; overflow: visible; }
  #sheet.editable svg g.node, #sheet.editable svg g.edgeLabel { cursor: grab; }
  #sheet.editable svg g.cluster > rect, #sheet.editable svg .statediagram-cluster rect { cursor: move; }
  #sheet.dragging, #sheet.dragging * { cursor: grabbing !important; }
  #sheet.editable svg g.node, #sheet.editable svg g.edgeLabel, .wm-hit, .wm-overlay .h { touch-action: none; }
  .wm-hit { fill: none; stroke: transparent; stroke-width: 12px; pointer-events: stroke; cursor: crosshair; }
  .wm-overlay .sel { fill: none; stroke: var(--ink); stroke-width: 1px; stroke-dasharray: 3 3; vector-effect: non-scaling-stroke; pointer-events: none; }
  .wm-overlay .edge-sel { fill: none; stroke: var(--ink); stroke-width: 5px; opacity: 0.12; vector-effect: non-scaling-stroke; pointer-events: none; }
  .wm-overlay .h { fill: var(--paper); stroke: var(--ink); stroke-width: 1px; vector-effect: non-scaling-stroke; }
  .wm-overlay .h.corner { cursor: nwse-resize; }
  .wm-overlay .h.corner.ne, .wm-overlay .h.corner.sw { cursor: nesw-resize; }
  .wm-overlay .h.via { fill: var(--ink); cursor: move; }
  .wm-overlay .h.add { cursor: copy; }
  .wm-overlay .pin { fill: var(--ink); pointer-events: none; }
  .wm-overlay .pin.hollow { fill: var(--paper); stroke: var(--ink); stroke-width: 1px; vector-effect: non-scaling-stroke; }

  .notice { position: sticky; left: 0; top: 0; z-index: 2; margin: 0; padding: 22px 16px 0; font-size: 12px; color: var(--warn); }

  .strip {
    display: flex; align-items: center; flex-wrap: wrap; gap: 6px 16px; min-height: 42px; box-sizing: border-box;
    padding: 6px 16px; border-top: 1px solid var(--line); font-size: 12px; color: var(--graphite);
  }
  .strip .sel-name { color: var(--ink); font-weight: 500; }
  .strip .kind { font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; }
  .strip .state { color: var(--ink); }
  .strip .field { display: flex; align-items: center; gap: 6px; }
  .strip .field input {
    width: 7ch; padding: 3px 0; border: 0; border-bottom: 1px solid var(--line-strong); border-radius: 0; background: transparent;
    font-size: 12px; font-variant-numeric: tabular-nums;
  }
  .strip .hint { flex: 1 1 280px; min-width: 0; }
  .btn {
    border: 0; outline: 1px solid var(--line-strong); outline-offset: -1px; background: transparent; cursor: pointer;
    padding: 5px 10px; font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink);
  }
  .btn:hover { background: var(--ink); color: var(--paper); outline-color: var(--ink); }
  kbd { font-family: var(--mono); font-size: 11px; padding: 0 4px; outline: 1px solid var(--line); outline-offset: -1px; color: var(--ink); }

  .figcap {
    grid-column: 2; display: flex; justify-content: space-between; gap: 8px 24px; flex-wrap: wrap;
    margin-top: -18px; font-size: 11px; letter-spacing: 0.06em; color: var(--graphite);
  }
  .figcap .coords { font-variant-numeric: tabular-nums; }

  .toast {
    position: fixed; right: var(--gutter-r); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    background: var(--ink); color: var(--paper); padding: 8px 12px; font-size: 12px;
    opacity: 0; transform: translateY(6px); transition: opacity .15s, transform .15s; pointer-events: none;
  }
  .toast.on { opacity: 1; transform: none; }

  @media (max-width: 860px) {
    body { height: auto; min-height: 100%; overflow: visible; grid-template-rows: auto auto auto; }
    main { grid-template-columns: minmax(0, 1fr); grid-template-rows: 46vh 72vh auto; gap: 28px; }
    .figcap { grid-column: 1; grid-row: 3; margin-top: -18px; }
    #sheet { padding: 40px 20px 20px; }
  }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>

<header class="topbar">
  <div class="wordmark">
    <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="0.5" y="0.5" width="6" height="6" fill="none" stroke="currentColor"/><rect x="9.5" y="9.5" width="6" height="6" fill="none" stroke="currentColor"/><path d="M3.5 7v5.5h5" fill="none" stroke="currentColor" stroke-dasharray="1.5 1.5"/></svg>
    Wermaid
  </div>
  <nav class="actions" aria-label="Actions">
    <button id="undo" class="text-btn" type="button" title="Ctrl/⌘ Z">Undo</button>
    <button id="redo" class="text-btn" type="button" title="Shift Ctrl/⌘ Z">Redo</button>
    <button id="reset-all" class="text-btn" type="button">Clear overrides</button>
    <button id="copy-src" class="text-btn" type="button">Copy source</button>
    <button id="copy-svg" class="text-btn" type="button">Copy SVG</button>
  </nav>
</header>

<section class="titlerow">
  <div>
    <h1 id="title">Wermaid</h1>
    <p>Mermaid lays it out. You nudge what needs it.</p>
  </div>
  <div class="controls">
    <label class="field-inline" for="example"><span class="eyebrow">Example</span>
      <select id="example" class="pick"></select>
    </label>
    <div class="seg" role="group" aria-label="Layout shown">
      <button id="mode-stock" type="button" aria-pressed="false" title="Show Mermaid's own layout">Stock</button>
      <button id="mode-wermaid" type="button" aria-pressed="true" title="Show the layout with your overrides">With overrides</button>
    </div>
  </div>
</section>

<main>
  <section class="plate source" aria-label="Source">
    <div class="plate-title"><h2>Source</h2><span class="meta" id="block-count"></span></div>
    <textarea id="src" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Mermaid source with layout block"></textarea>
    <div id="messages" class="messages" aria-live="polite"></div>
  </section>

  <section class="plate canvas" aria-label="Diagram">
    <div class="plate-title">
      <h2>Diagram</h2>
      <div class="tools">
        <label for="edge-style">Edges
          <select id="edge-style" class="pick small" title="How edges are drawn">
            <option value="">Mermaid</option>
            <option value="rounded">Rounded</option>
            <option value="orthogonal">Orthogonal</option>
            <option value="curved">Curved</option>
          </select>
        </label>
        <label for="snap"><input id="snap" type="checkbox" checked> Snap 8</label>
        <div class="zoom">
          <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
          <output id="zoom-val">100%</output>
          <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
          <button id="zoom-fit" type="button">Fit</button>
        </div>
      </div>
    </div>
    <div class="sheet-wrap" id="sheet-wrap">
      <p class="notice" id="notice" hidden></p>
      <div id="sheet"></div>
    </div>
    <div class="strip" id="strip"></div>
  </section>
  <div class="figcap"><span id="figcap">Fig. 1</span><span class="coords" id="coords"></span></div>
</main>
<div class="toast" id="toast" role="status"></div>

<script type="module">
/*__WERMAID_LIBRARY__*/

/* ================================================================== */
/* Editor                                                              */
/* ================================================================== */

const MERMAID_URL = new URLSearchParams(location.search).get('mermaid')
  || 'https://cdn.jsdelivr.net/npm/mermaid@11.16.1/dist/mermaid.esm.min.mjs';
const { default: mermaid } = await import(MERMAID_URL);

const EXAMPLES = /*__WERMAID_EXAMPLES__*/;

const $ = (id) => document.getElementById(id);
const srcEl = $('src'), sheet = $('sheet'), wrap = $('sheet-wrap'), strip = $('strip');
const SVGNS = 'http://www.w3.org/2000/svg';
const DRAFT_KEY = 'wermaid:draft:v1';

const wermaid = createWermaid(mermaid);
let diagram = null;          // current render
let renderedBody = null;     // Mermaid body the current render came from
let overrides = emptyOverrides();
let selection = null;        // { kind: 'node' | 'cluster' | 'edge', id }
let showStock = false;
let zoom = 1;
let renderSeq = 0;
const undoStack = [], redoStack = [];

/* ---------- theme ---------- */
const darkQuery = matchMedia('(prefers-color-scheme: dark)');
const isDark = () => {
  const t = document.documentElement.dataset.theme;
  return t ? t === 'dark' : darkQuery.matches;
};
let currentTheme = null;
/** Mermaid theme built from the page's own color tokens: thin outlines, mono type, no fills. */
function initMermaid() {
  const dark = isDark();
  const key = dark ? 'dark' : 'light';
  if (key === currentTheme) return false;
  currentTheme = key;
  const cs = getComputedStyle(document.documentElement);
  const t = (n) => cs.getPropertyValue(n).trim();
  const c = { paper: t('--paper'), ink: t('--ink'), graphite: t('--graphite'), line: t('--line'), strong: t('--line-strong') };
  const font = '"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace';
  mermaid.initialize({
    startOnLoad: false, securityLevel: 'strict', theme: 'base', darkMode: dark, fontFamily: font,
    flowchart: { htmlLabels: true, padding: 14, nodeSpacing: 56, rankSpacing: 56 },
    themeVariables: {
      darkMode: dark, background: c.paper, fontFamily: font, fontSize: '13px',
      primaryColor: c.paper, primaryTextColor: c.ink, primaryBorderColor: c.strong,
      secondaryColor: c.paper, secondaryTextColor: c.ink, secondaryBorderColor: c.strong,
      tertiaryColor: c.paper, tertiaryTextColor: c.ink, tertiaryBorderColor: c.line,
      mainBkg: c.paper, nodeBorder: c.strong, nodeTextColor: c.ink, textColor: c.ink, titleColor: c.ink,
      lineColor: c.ink, clusterBkg: c.paper, clusterBorder: c.line, edgeLabelBackground: c.paper,
      classText: c.ink, labelBackgroundColor: c.paper,
      stateBkg: c.paper, stateBorder: c.strong, transitionColor: c.ink, transitionLabelColor: c.graphite,
      specialStateColor: c.ink, innerEndBackground: c.ink, compositeBackground: c.paper,
      compositeTitleBackground: c.paper, altBackground: c.paper, stateLabelColor: c.ink,
      actorBkg: c.paper, actorBorder: c.strong, actorTextColor: c.ink, actorLineColor: c.line,
      signalColor: c.ink, signalTextColor: c.ink, noteBkgColor: c.paper, noteBorderColor: c.line,
      noteTextColor: c.graphite, activationBkgColor: c.paper, activationBorderColor: c.strong,
      labelBoxBkgColor: c.paper, labelBoxBorderColor: c.line, labelTextColor: c.ink, loopTextColor: c.graphite,
    },
    themeCSS: `
      .node rect, .node polygon, .node circle, .node ellipse, .node path, .cluster rect,
      .statediagram-cluster rect, .classGroup rect, .divider, .actor { stroke-width: 1px !important; }
      .flowchart-link, .transition, .relation { stroke-width: 1px !important; }
      .edgeLabel, .edgeLabel p, .edgeLabel span { color: ${c.graphite} !important; font-size: 12px; }
      .edgeLabel rect, .labelBkg { fill: ${c.paper} !important; background-color: ${c.paper} !important; }
      .cluster-label span, .cluster-label p { color: ${c.ink}; font-weight: 500; }
    `,
  });
  return true;
}
initMermaid();
const rethemed = () => { if (initMermaid()) { renderedBody = null; refresh(srcEl.value); } };
darkQuery.addEventListener('change', rethemed);
new MutationObserver(rethemed).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

/* ---------- storage (per-viewer draft) ---------- */
const store = {
  get() { try { return JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); } catch { return null; } },
  set(v) { try { localStorage.setItem(DRAFT_KEY, JSON.stringify(v)); } catch { /* storage unavailable */ } },
};

/* ---------- examples ---------- */
const exSel = $('example');
for (const [i, ex] of EXAMPLES.entries()) exSel.add(new Option(ex.name, String(i)));
exSel.add(new Option('Your draft', 'draft'));
exSel.addEventListener('change', () => {
  if (exSel.value === 'draft') return;
  const ex = EXAMPLES[+exSel.value];
  loadSource(ex.source, { resetHistory: true });
});

/* ---------- source ⇄ diagram ---------- */
let inputTimer = 0;
srcEl.addEventListener('input', () => {
  clearTimeout(inputTimer);
  inputTimer = setTimeout(() => {
    pushUndo(lastCommitted);
    lastCommitted = srcEl.value;
    exSel.value = 'draft';
    refresh(srcEl.value);
  }, 280);
});
let lastCommitted = '';

async function loadSource(text, { resetHistory } = {}) {
  srcEl.value = text;
  if (resetHistory) { undoStack.length = 0; redoStack.length = 0; updateUndoButtons(); }
  lastCommitted = text;
  selection = null;
  renderedBody = null;
  await refresh(text);
  fitToSheet({ max: 1 });
}

async function refresh(text) {
  const parsed = parseSource(text);
  store.set({ source: text, example: exSel.value });
  if (diagram && parsed.body === renderedBody) {
    overrides = parsed.overrides;
    apply();
    showMessages(parsed.errors);
    return;
  }
  const seq = ++renderSeq;
  try {
    await mermaid.parse(parsed.body);
  } catch (err) {
    if (seq !== renderSeq) return;
    showMessages(parsed.errors, err);
    return;
  }
  const scrollPos = [wrap.scrollLeft, wrap.scrollTop];
  // Render next to the current drawing and swap only on success,
  // so a failed render never blanks the sheet.
  const staging = document.createElement('div');
  sheet.append(staging);
  let next;
  try {
    next = await wermaid.render(staging, text, { id: `wm-d${seq}` });
  } catch (err) {
    staging.remove();
    if (seq !== renderSeq) return;
    showMessages(parsed.errors, err);
    return;
  }
  if (seq !== renderSeq) { staging.remove(); return; }
  for (const child of [...sheet.children]) if (child !== staging) child.remove();
  diagram = next;
  renderedBody = parsed.body;
  overrides = diagram.overrides;
  sheet.classList.toggle('editable', diagram.supported);
  addHitPaths();
  if (selection && !targetExists(selection)) selection = null;
  apply();
  [wrap.scrollLeft, wrap.scrollTop] = scrollPos;
  const notice = $('notice');
  notice.hidden = diagram.supported;
  notice.textContent = diagram.supported ? '' :
    `This ${diagram.type || 'diagram'} renders as stock Mermaid. Layout editing works on flowcharts, state diagrams and class diagrams.`;
  showMessages(parsed.errors);
}

function targetExists(sel) {
  const s = diagram?.scene;
  if (!s) return false;
  return sel.kind === 'node' ? s.nodes.has(sel.id) : sel.kind === 'cluster' ? s.clusters.has(sel.id) : s.edges.has(sel.id);
}

/** Re-key edge entries by resolved edge id so editor lookups are stable. */
function normalizeOverrides() {
  const next = new Map();
  for (const [key, e] of overrides.targets) {
    if (e.kind === 'edge' && e.resolved) next.set(`edge:${e.resolved}`, e);
    else next.set(key, e);
  }
  overrides.targets = next;
}

let dragViewBox = null;
function apply() {
  if (!diagram) return;
  if (showStock) diagram.showStock();
  else { diagram.setOverrides(overrides); normalizeOverrides(); }
  if (dragViewBox) {
    // Hold the frame still while dragging; it refits when the drag ends.
    diagram.svg.setAttribute('viewBox', dragViewBox);
  }
  $('edge-style').value = overrides.settings?.edges?.style || '';
  sizeSvg();
  syncHitPaths();
  drawOverlay();
  renderStrip();
  updateBlockCount();
  showWarnings();
}

function writeBack({ commit } = {}) {
  const text = diagram.writeSource(srcEl.value);
  if (text !== srcEl.value) {
    const { scrollTop } = srcEl;
    srcEl.value = text;
    srcEl.scrollTop = scrollTop;
  }
  store.set({ source: text, example: exSel.value });
  if (commit && text !== lastCommitted) {

  }
}

/* ---------- undo ---------- */

}

}

function updateUndoButtons() {

$('undo').addEventListener('click', undo);

/* ---------- messages ---------- */
let lastParseErrors = [], lastRenderError = null;

}
function showWarnings() {

    const div = document.createElement('div');
    div.className = `msg ${cls}`;

function updateBlockCount() {

    + (overrides.settings?.edges ? 1 : 0);

/* ---------- sizing & zoom ---------- */
function sizeSvg() {
  const svg = diagram?.svg;

  const vb = svg.viewBox.baseVal;
  svg.style.maxWidth = 'none';
  svg.setAttribute('width', String(Math.round(vb.width * zoom)));
  svg.setAttribute('height', String(Math.round(vb.height * zoom)));

}
const setZoom = (z) => { zoom = Math.max(0.25, Math.min(3, z)); sizeSvg(); drawOverlay(); };
$('zoom-in').addEventListener('click', () => setZoom(zoom * 1.2));
$('zoom-out').addEventListener('click', () => setZoom(zoom / 1.2));
function fitToSheet({ max = 1.5 } = {}) {
  if (!diagram) return;

  setZoom(Math.min((wrap.clientWidth - pad) / vb.width, (wrap.clientHeight - pad) / vb.height, max));

$('zoom-fit').addEventListener('click', () => fitToSheet());

/* ---------- edge hit areas ---------- */
function addHitPaths() {
  if (!diagram?.scene) return;
  for (const e of diagram.scene.edges.values()) {
    const hit = document.createElementNS(SVGNS, 'path');
    hit.setAttribute('class', 'wm-hit');
    hit.dataset.wmEdge = e.id;
    e.pathEl.after(hit);
    e.hitEl = hit;
  }
}
function syncHitPaths() {
  if (!diagram?.scene) return;
  for (const e of diagram.scene.edges.values()) {
    if (!e.hitEl) continue;
    e.hitEl.setAttribute('d', e.pathEl.getAttribute('d'));
    const t = e.pathEl.getAttribute('transform');
    t ? e.hitEl.setAttribute('transform', t) : e.hitEl.removeAttribute('transform');
    e.hitEl.style.display = showStock ? 'none' : '';
  }
}

/* ---------- overrides helpers ---------- */
function entryFor(kind, id, create = true) {
  const key = kind === 'edge' ? `edge:${id}` : id;
  let e = overrides.targets.get(key);
  if (!e && create) {
    e = { kind: kind === 'edge' ? 'edge' : 'node', selector: id };
    if (kind === 'edge') e.resolved = id;
    overrides.targets.set(key, e);
  }
  return e;
}
function clearEntry(kind, id) {

}
const snapOn = () => $('snap').checked;
const snap = (v) => (snapOn() ? Math.round(v / 8) * 8 : Math.round(v * 10) / 10);

/* ---------- overlay ---------- */
function overlayGroup() {
  let g = diagram.svg.querySelector(':scope > g.wm-overlay');
  if (!g) {
    g = document.createElementNS(SVGNS, 'g');
    g.setAttribute('class', 'wm-overlay');
    diagram.svg.append(g);
  }
  return g;
}
function el(tag, attrs, parent) {
  const n = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  parent?.append(n);
  return n;
}
function pxScale() {
  const m = diagram.svg.getScreenCTM();
  return m ? m.a : 1;
}
function drawOverlay() {
  if (!diagram?.svg) return;
  const g = overlayGroup();
  g.replaceChildren();
  if (showStock || !diagram.supported || !diagram.geometry) return;
  const k = 1 / pxScale();
  const geom = diagram.geometry;

  // Small markers on shapes that carry an override.
  for (const [id, n] of geom.nodes) {
    const ov = overrides.targets.get(id);
    if (ov && (ov.at || ov.nudge || ov.size)) el('circle', { class: ov.at ? 'pin' : 'pin hollow', cx: n.box.x + n.box.w, cy: n.box.y, r: 3 * k }, g);
  }
  if (!selection) return;
  if (selection.kind === 'node' || selection.kind === 'cluster') {
    const b = (selection.kind === 'node' ? geom.nodes : geom.clusters).get(selection.id)?.box;
    if (!b) return;
    const p = 4 * k;
    el('rect', { class: 'sel', x: b.x - p, y: b.y - p, width: b.w + 2 * p, height: b.h + 2 * p }, g);
    if (selection.kind === 'node') {
      const s = 8 * k;
      const corners = { nw: [b.x, b.y], ne: [b.x + b.w, b.y], sw: [b.x, b.y + b.h], se: [b.x + b.w, b.y + b.h] };
      for (const [name, [x, y]] of Object.entries(corners)) {
        el('rect', { class: `h corner ${name}`, x: x - s / 2, y: y - s / 2, width: s, height: s, 'data-handle': `corner:${name}` }, g);
      }
    }
  } else if (selection.kind === 'edge') {
    const e = diagram.scene.edges.get(selection.id);
    const ge = geom.edges.get(selection.id);
    if (!e || !ge) return;
    const outline = el('path', { class: 'edge-sel', d: e.pathEl.getAttribute('d') }, g);
    const m = ctmToDiagram(e.pathEl);
    outline.setAttribute('transform', `matrix(${m.a},${m.b},${m.c},${m.d},${m.e},${m.f})`);
    const route = routePoints(selection.id);
    const r = 5 * k;
    for (let i = 0; i < route.length - 1; i++) {
      const a = route[i], b = route[i + 1];
      el('circle', { class: 'h add', cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2, r: r * 0.85, 'data-handle': `add:${i}` }, g);
    }
    (entryFor('edge', selection.id, false)?.via || []).forEach((v, i) => {
      el('circle', { class: 'h via', cx: v.x, cy: v.y, r, 'data-handle': `via:${i}` }, g);
    });
  }
}

/** Matrix from an element's user space to the diagram's, as it is drawn right now. */
function ctmToDiagram(node) {
  return diagram.svg.getScreenCTM().inverse().multiply(node.getScreenCTM());

/** Points a user edits for an edge: its two ends plus any waypoints. */

  if (via.length) return [ge.points[0], ...via, ge.points.at(-1)];
  // Auto route: put the "+" on the drawn line's real midpoint.
  const e = diagram.scene.edges.get(id);
  const mid = e.pathEl.getPointAtLength(e.pathEl.getTotalLength() / 2).matrixTransform(ctmToDiagram(e.pathEl));

/* ---------- instrument strip ---------- */
function renderStrip() {
  strip.replaceChildren();
  const span = (cls, text) => { const s = document.createElement('span'); if (cls) s.className = cls; s.textContent = text; return s; };
  if (!diagram) return;
  if (showStock) {
    strip.append(span('hint', 'Showing Mermaid’s own layout. Switch to “With overrides” to edit.'));
    return;
  }
  if (!diagram.supported) {
    strip.append(span('hint', 'Editing is off for this diagram type.'));
    return;
  }
  if (!selection) {
    const hint = span('hint', '');
    hint.innerHTML = 'Drag a shape to nudge it from its auto-layout spot; <kbd>Alt</kbd>-drag pins it in place. Drag a corner to resize, a line to bend it (double-click a bend to remove it), a subgraph’s frame to move everything inside. <kbd>←↑→↓</kbd> nudge · <kbd>Del</kbd> resets.';
    strip.append(hint);
    return;
  }
  const geom = diagram.geometry;
  strip.append(span('kind', selection.kind === 'cluster' ? 'subgraph' : selection.kind));
  const ov = entryFor(selection.kind, selection.id, false);
  const field = (label, value, onSet) => {
    const wrapEl = document.createElement('label');
    wrapEl.className = 'field';
    const id = `f-${label}`;
    wrapEl.htmlFor = id;
    wrapEl.append(label);
    const input = document.createElement('input');
    input.id = id; input.type = 'number'; input.step = '1'; input.value = String(Math.round(value * 10) / 10);
    input.addEventListener('change', () => { const v = parseFloat(input.value); if (Number.isFinite(v)) onSet(v); });
    wrapEl.append(input);
    strip.append(wrapEl);
  };
  if (selection.kind === 'node') {
    const id = selection.id;
    strip.append(span('sel-name', id));
    const n = geom.nodes.get(id);
    const pinned = isPinned(id);
    const nudge = ov?.nudge || { x: 0, y: 0 };
    strip.append(span('state', pinned ? 'pinned' : (nudge.x || nudge.y) ? 'nudged' : 'auto layout'));
    if (pinned) {
      field('x', n.box.cx, (v) => { placeNode(id, { x: v, y: n.box.cy }, { snapped: false }); commit(); });
      field('y', n.box.cy, (v) => { placeNode(id, { x: n.box.cx, y: v }, { snapped: false }); commit(); });
    } else {
      const setNudge = (x, y) => { const e = entryFor('node', id); e.nudge = { x, y }; delete e.at; commit(); };
      field('dx', nudge.x, (v) => setNudge(v, nudge.y));
      field('dy', nudge.y, (v) => setNudge(nudge.x, v));
    }
    field('w', n.box.w, (v) => { entryFor('node', id).size = { w: Math.max(8, v), h: n.box.h }; commit(); });
    field('h', n.box.h, (v) => { entryFor('node', id).size = { w: n.box.w, h: Math.max(8, v) }; commit(); });
    const toggle = document.createElement('button');
    toggle.className = 'btn'; toggle.type = 'button';
    toggle.textContent = pinned ? 'Unpin' : 'Pin here';
    toggle.title = pinned
      ? 'Keep this spot as an offset from the auto layout, so it follows layout changes'
      : 'Fix this shape at its current coordinates, whatever the auto layout does';
    toggle.addEventListener('click', () => { placeNode(id, { x: n.box.cx, y: n.box.cy }, { pin: !pinned, snapped: false }); commit(); });
    strip.append(toggle);
  } else if (selection.kind === 'cluster') {
    strip.append(span('sel-name', selection.id));
    const c = geom.clusters.get(selection.id);
    const setNudge = (x, y) => { const e = entryFor('cluster', selection.id); e.nudge = { x, y }; delete e.at; commit(); };

    field('dy', c.offset.y, (v) => setNudge(c.offset.x, v));
  } else {
    const e = diagram.scene.edges.get(selection.id);
    strip.append(span('sel-name', `${e.start} → ${e.end}`));
    const via = ov?.via?.length || 0;
    strip.append(span('', via ? `${via} bend${via === 1 ? '' : 's'}` : 'auto route'));
    if (ov?.label) strip.append(span('', `label moved ${Math.round(ov.label.x)}, ${Math.round(ov.label.y)}`));
    const wrapEl = document.createElement('label');
    wrapEl.className = 'field';
    wrapEl.htmlFor = 'f-edge-style';
    wrapEl.append('style');
    const sel = document.createElement('select');
    sel.id = 'f-edge-style'; sel.className = 'pick';
    for (const [v, t] of [['', 'Diagram default'], ['rounded', 'Rounded'], ['orthogonal', 'Orthogonal'], ['curved', 'Curved']]) sel.add(new Option(t, v));
    sel.value = ov?.style || '';
    const edgeId = selection.id;
    sel.addEventListener('change', () => {
      const e = entryFor('edge', edgeId);
      if (sel.value) e.style = sel.value; else delete e.style;
      commit();
    });
    wrapEl.append(sel);
    strip.append(wrapEl);
  }
  if (ov && (ov.at || ov.nudge || ov.size || ov.via?.length || ov.label || ov.style)) {
    const b = document.createElement('button');
    b.className = 'btn'; b.type = 'button'; b.textContent = 'Reset this';
    b.addEventListener('click', () => { clearEntry(selection.kind, selection.id); commit(); });

}
function showCoords(p) {
  $('coords').textContent = p ? `x ${Math.round(p.x)}  y ${Math.round(p.y)}` : '';
}

function exampleName() {
  return exSel.value === 'draft' ? 'Your draft' : exSel.selectedOptions[0]?.textContent || 'Diagram';
}
function updateCaption(count) {
  const name = exampleName();
  $('title').textContent = name;
  const state = showStock ? 'stock layout' : count ? `with ${count} override${count === 1 ? '' : 's'}` : 'auto layout';
  $('figcap').textContent = `Fig. 1 · ${name}, ${state}`;
}

/* ---------- placing nodes: nudge by default, pin on request ---------- */
const isPinned = (id) => !!entryFor('node', id, false)?.at;
/** Put a node's center at an absolute point, stored as a nudge (default) or a pin. */
function placeNode(id, center, { pin = isPinned(id), snapped = true } = {}) {
  const e = entryFor('node', id);
  const inh = diagram.geometry.nodes.get(id).inherited;
  const base = diagram.scene.nodes.get(id).box;
  const q = (v) => (snapped ? snap(v) : Math.round(v * 10) / 10);
  if (pin) {
    e.at = { x: q(center.x) - inh.x, y: q(center.y) - inh.y };
    delete e.nudge;
  } else {
    e.nudge = { x: q(center.x - inh.x - base.cx), y: q(center.y - inh.y - base.cy) };
    delete e.at;
  }

function commit() {
  apply();
  writeBack({ commit: true });
}

/* ---------- pointer interaction ---------- */
let drag = null;

function hitTarget(target) {
  const handle = target.closest('[data-handle]');
  if (handle) return { type: 'handle', handle: handle.dataset.handle };
  const hit = target.closest('.wm-hit');
  if (hit) return { type: 'edge', id: hit.dataset.wmEdge };
  const s = diagram.scene;
  const label = target.closest('g.edgeLabel');
  if (label) for (const e of s.edges.values()) if (e.labelEl === label) return { type: 'label', id: e.id };
  const node = target.closest('g.node');
  if (node) for (const n of s.nodes.values()) if (n.el === node || n.el.contains(node)) return { type: 'node', id: n.id };
  for (const n of s.nodes.values()) if (n.el.contains(target)) return { type: 'node', id: n.id };
  // Clusters: innermost one whose group contains the target.
  let best = null;
  for (const c of s.clusters.values()) if (c.el.contains(target) && (!best || best.depth < c.depth)) best = c;
  if (best) return { type: 'cluster', id: best.id };
  return { type: 'none' };
}

sheet.addEventListener('pointermove', (ev) => {
  if (!diagram?.svg || drag) return;
  showCoords(diagram.toDiagram(ev.clientX, ev.clientY));
});

sheet.addEventListener('pointerdown', (ev) => {
  if (!diagram?.supported || showStock || ev.button !== 0) return;
  if (!diagram.svg.contains(ev.target)) { select(null); return; }
  const t = hitTarget(ev.target);
  const p0 = diagram.toDiagram(ev.clientX, ev.clientY);
  const geom = diagram.geometry;
  drag = { p0, moved: false, pointerId: ev.pointerId, before: srcEl.value };

  if (t.type === 'handle') {
    const [kind, arg] = t.handle.split(':');
    if (kind === 'corner') {
      const b = geom.nodes.get(selection.id).box;
      const fixed = { nw: [b.x + b.w, b.y + b.h], ne: [b.x, b.y + b.h], sw: [b.x + b.w, b.y], se: [b.x, b.y] }[arg];
      Object.assign(drag, { kind: 'resize', id: selection.id, fixed: { x: fixed[0], y: fixed[1] }, inherited: geom.nodes.get(selection.id).inherited });
    } else if (kind === 'via' && isDoublePress(`${selection.id}:${arg}`)) {
      // Double-click on a bend removes it.
      const e = entryFor('edge', selection.id);
      e.via = e.via.filter((_, i) => i !== +arg);
      if (!e.via.length) delete e.via;
      drag = null;
      ev.preventDefault();
      commit();
      return;
    } else if (kind === 'via') {
      Object.assign(drag, { kind: 'via', id: selection.id, index: +arg, start: { ...entryFor('edge', selection.id).via[+arg] } });
    } else if (kind === 'add') {
      const e = entryFor('edge', selection.id);
      const route = routePoints(selection.id);
      const a = route[+arg], b = route[+arg + 1];
      const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      e.via = [...(e.via || [])];
      const index = Math.min(+arg, e.via.length);
      e.via.splice(index, 0, mid);
      Object.assign(drag, { kind: 'via', id: selection.id, index, start: mid });
    }

    select({ kind: 'node', id: t.id });
    const n = geom.nodes.get(t.id);
    // Alt flips the default: drag nudges, Alt-drag pins (and the reverse for a pinned node).
    Object.assign(drag, { kind: 'node', id: t.id, start: { x: n.box.cx, y: n.box.cy }, pin: isPinned(t.id) !== ev.altKey });
  } else if (t.type === 'cluster') {
    select({ kind: 'cluster', id: t.id });

  } else if (t.type === 'label') {

  } else if (t.type === 'edge') {

    const existing = entryFor('edge', t.id, false)?.via?.length || 0;
    Object.assign(drag, { kind: 'newvia', id: t.id, index: Math.min(bestI, existing), start: { x: p0.x, y: p0.y } });

    drag = null;
    return;
  }
  sheet.setPointerCapture(ev.pointerId);
  ev.preventDefault();
});

sheet.addEventListener('pointermove', (ev) => {
  if (!drag || ev.pointerId !== drag.pointerId) return;
  const p = diagram.toDiagram(ev.clientX, ev.clientY);
  const dx = p.x - drag.p0.x, dy = p.y - drag.p0.y;
  if (!drag.moved) {
    if (Math.hypot(dx, dy) * pxScale() < 3) return;
    drag.moved = true;
    dragViewBox = diagram.svg.getAttribute('viewBox');
    sheet.classList.add('dragging');
    if (drag.kind === 'newvia') {
      const e = entryFor('edge', drag.id);
      e.via = [...(e.via || [])];
      e.via.splice(drag.index, 0, { ...drag.start });
      drag.kind = 'via';
    }
  }
  const s = drag.start;
  switch (drag.kind) {
    case 'node': {
      placeNode(drag.id, { x: s.x + dx, y: s.y + dy }, { pin: drag.pin });
      break;
    }
    case 'cluster': {
      const e = entryFor('cluster', drag.id);
      e.nudge = { x: snap(s.x + dx), y: snap(s.y + dy) };
      delete e.at;
      break;
    }
    case 'resize': {
      const q = { x: snap(p.x), y: snap(p.y) };
      const w = Math.max(16, Math.abs(q.x - drag.fixed.x)), h = Math.max(16, Math.abs(q.y - drag.fixed.y));
      const cx = drag.fixed.x + Math.sign(q.x - drag.fixed.x || 1) * w / 2;
      const cy = drag.fixed.y + Math.sign(q.y - drag.fixed.y || 1) * h / 2;
      entryFor('node', drag.id).size = { w, h };
      placeNode(drag.id, { x: cx, y: cy }, { snapped: false });
      break;
    }
    case 'via': {
      const e = entryFor('edge', drag.id);
      e.via = [...e.via];
      e.via[drag.index] = { x: snap(s.x + dx), y: snap(s.y + dy) };
      break;
    }
    case 'label': {
      const e = entryFor('edge', drag.id);
      e.label = { x: Math.round(s.x + dx), y: Math.round(s.y + dy) };
      break;
    }
  }
  showCoords(p);
  scheduleApply();
});

let raf = 0;
function scheduleApply() {
  if (raf) return;
  raf = requestAnimationFrame(() => { raf = 0; apply(); writeBack(); });
}

function endDrag(ev) {
  if (!drag || ev.pointerId !== drag.pointerId) return;
  const wasMoved = drag.moved;
  const before = drag.before;
  drag = null;
  dragViewBox = null;
  sheet.classList.remove('dragging');
  if (raf) { cancelAnimationFrame(raf); raf = 0; }
  if (wasMoved) {
    apply();
    writeBack();
    if (srcEl.value !== before) { pushUndo(before); lastCommitted = srcEl.value; }

sheet.addEventListener('pointerup', endDrag);
sheet.addEventListener('pointercancel', endDrag);

function distToSegment(p, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const len2 = dx * dx + dy * dy || 1;
  const t = Math.max(0, Math.min(1, ((p.x - a.x) * dx + (p.y - a.y) * dy) / len2));
  return Math.hypot(p.x - (a.x + t * dx), p.y - (a.y + t * dy));
}

function select(sel) {
  selection = sel;
  drawOverlay();
  renderStrip();
}

/* ---------- keyboard ---------- */
document.addEventListener('keydown', (ev) => {
  const inField = ev.target.closest?.('textarea, input, select');
  const mod = ev.metaKey || ev.ctrlKey;
  if (mod && ev.key.toLowerCase() === 'z' && !inField) {
    ev.preventDefault();
    ev.shiftKey ? redo() : undo();
    return;
  }
  if (inField || !selection || !diagram?.supported || showStock) return;
  if (ev.key === 'Escape') { select(null); return; }
  if (ev.key === 'Delete' || ev.key === 'Backspace') {
    ev.preventDefault();
    clearEntry(selection.kind, selection.id);
    commit();
    return;
  }
  const dir = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[ev.key];
  if (!dir) return;
  ev.preventDefault();
  const step = ev.shiftKey ? 10 : snapOn() ? 8 : 1;
  const geom = diagram.geometry;
  if (selection.kind === 'node') {
    const n = geom.nodes.get(selection.id);
    placeNode(selection.id, { x: n.box.cx + dir[0] * step, y: n.box.cy + dir[1] * step }, { snapped: false });
  } else if (selection.kind === 'cluster') {
    const c = geom.clusters.get(selection.id);
    const e = entryFor('cluster', selection.id);
    e.nudge = { x: c.offset.x + dir[0] * step, y: c.offset.y + dir[1] * step };
    delete e.at;
  } else return;
  commit();
});

/* ---------- header actions ---------- */
function setMode(stock) {
  showStock = stock;
  $('mode-stock').setAttribute('aria-pressed', String(stock));
  $('mode-wermaid').setAttribute('aria-pressed', String(!stock));
  sheet.classList.toggle('editable', !!diagram?.supported && !stock);
  apply();
  updateBlockCount();
}
$('mode-stock').addEventListener('click', () => setMode(true));
$('mode-wermaid').addEventListener('click', () => setMode(false));

$('edge-style').addEventListener('change', (ev) => {
  if (!diagram) return;
  overrides.settings = overrides.settings || {};
  const style = ev.target.value;
  if (style) overrides.settings.edges = { ...overrides.settings.edges, style };
  else delete overrides.settings.edges;
  commit();
});

$('reset-all').addEventListener('click', () => {
  if (!diagram || (!overrides.targets.size && !overrides.settings?.edges)) { toast('There are no overrides to clear'); return; }
  overrides.targets.clear();
  overrides.settings = {};
  commit();
  toast('Overrides cleared. Undo brings them back.');
});

let toastTimer = 0;
function toast(text) {
  const t = $('toast');
  t.textContent = text;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 1800);
}
async function copyText(text, done) {
  try {
    await navigator.clipboard.writeText(text);
    toast(done);
  } catch {
    srcEl.focus();
    srcEl.select();
    toast('Copy was blocked. The source is selected so you can copy it yourself.');
  }
}
$('copy-src').addEventListener('click', () => copyText(srcEl.value, 'Source copied'));
$('copy-svg').addEventListener('click', () => {
  if (!diagram) return;
  const clone = diagram.svg.cloneNode(true);
  clone.querySelectorAll('.wm-overlay, .wm-hit').forEach((n) => n.remove());
  clone.removeAttribute('width'); clone.removeAttribute('height');
  copyText(clone.outerHTML, 'SVG copied');
});

/* ---------- boot ---------- */
updateUndoButtons();
// Mermaid measures text when it lays out, so the diagram font must be ready first.
try {
  await Promise.race([
    Promise.all(['400 13px "IBM Plex Mono"', '500 13px "IBM Plex Mono"'].map((f) => document.fonts.load(f))),
    new Promise((resolve) => setTimeout(resolve, 2500)),
  ]);
} catch { /* render with the fallback font */ }
const saved = store.get();
if (saved?.source) {
  exSel.value = saved.example && exSel.querySelector(`option[value="${saved.example}"]`) ? saved.example : 'draft';
  await loadSource(saved.source, { resetHistory: true });
} else {
  exSel.value = '0';
  await loadSource(EXAMPLES[0].source, { resetHistory: true });
}
window.READY = true;
</script>
